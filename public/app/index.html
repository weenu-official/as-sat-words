ths while producing no obvious symptoms until the harm becomes severe.","c":"insidiously","s":0,"src":"own","f":"Science"},{"e":"The villain's influence proves insidious, planting small doubts in the heroine's mind until she no longer trusts her closest friends.","c":"insidious","s":0,"src":"own","f":"Literature"},{"e":"Researchers describe implicit bias as insidious, subtly shaping hiring decisions even among people who consciously believe themselves fair.","c":"insidious","s":0,"src":"own","f":"Social science"},{"e":"Critics warn that certain tracking algorithms work insidiously, gathering personal data so quietly that users rarely realize how closely they're monitored.","c":"insidiously","s":0,"src":"own","f":"Current affairs"},{"e":"Propaganda spread through the kingdom in insidious ways, subtly reshaping public opinion long before any open rebellion appeared.","c":"insidious","s":0,"src":"own","f":"History"},{"e":"The invasive vine spreads insidiously through the forest, quietly strangling native saplings long before anyone notices the canopy thinning.","c":"insidiously","s":0,"src":"own","f":"Science"},{"e":"A quiet insidious dread creeps through the narrator's thoughts, undermining her confidence long before the story reveals any real threat.","c":"insidious","s":0,"src":"own","f":"Literature"},{"e":"Misinformation can be insidious, spreading through casual conversation until false beliefs feel like common knowledge to an entire community.","c":"insidious","s":0,"src":"own","f":"Social science"},{"e":"Air pollution's effects are often insidious, harming residents' lungs gradually over years before any obvious illness appears.","c":"insidious","s":0,"src":"own","f":"Current affairs"},{"e":"With the same insidious views, they now seduced the members from the league, by representing to their pride the violation it committed on their sovereignty.","c":"insidious","s":null,"src":"classic","a":"Hamilton, Madison, Jay, The Federalist Papers (1788)"},{"e":"For, almos function streakFrom(days,end){let s=0,d=end,freezeUsedAt=-99,steps=0;

    break}

  if(boss)pool=["context","reverse","meaning","context"];
  else if(b<=0)pool=["meaning","reverse"];

  const inp=document.getElementById("pin");inp.focus();
  const go=()=>{const v=inp.value.trim();if(!/^\d{4}$/.test(v)){document.getElementById("pinMsg").textContent="Use exactly 4 digits.";return}
    if(!hasPin){state.settings.pin=v;save();PARENT=true;render();return}
    if(v===state.settings.pin){PARENT=true;render()}else{document.getElementById("pinMsg").textContent="That PIN doesn't match.";inp.value=""}};
  document.getElementById("pinGo").onclick=go;inp.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}
function accountHTML(){
  const g=promise();let status,actions="";
  if(paid()){status=`<b>Full program active</b><span>${daysLeft()} days left, until ${dstr(ENT.expires_at)}.</span>`;
    actions=`<button class="btn ghost" data-buy="extension">Add 30 review days${priceLabel("extension")?" · "+priceLabel("extension"):""}</button>`}
  else if(ENT&&ENT.expires_at){status=`<b>Program ended ${dstr(ENT.expires_at)}</b><span>Progress is saved. A review pass reopens everything for 30 days.</span>`;
    actions=`<button class="btn" data-buy="extension">Buy a 30-day review pass${priceLabel("extension")?" · "+priceLabel("extension"):""}</button>`}
  else{status=`<b>Free trial</b><span>Units 1 to 3 (30 words). The full program unlocks all 350 words for 3 months.</span>`;
    actions=`<button class="btn" data-buy="program">Unlock the 3-month program${priceLabel("program")?" · "+priceLabel("program"):""}</button>`}
  const gtxt=!g?"":g.status==="extended"?"Promise applied: one extra month was added.":g.status==="completed"?"All 350 words finished within 44 days.":g.status==="not_eligible"?`Promise period ended with ${g.studied} study days (${PROMISE_STUDY_DAYS} needed).`:`${g.studied} of ${PROMISE_STUDY_DAYS} study days so far. Ends ${dstr(g.end.toISOString())}.`;
  return `<section class="acct"><h2 style="margin-top:0">Plan</h2><div class="pstatus on">${status}</div>
    ${g?`<p class="small muted" style="margin:10px 0 0"><b>44-day promise:</b> ${gtxt}</p>`:""}
    <div class="actions" style="flex-wrap:wrap">${actions}</div>
    <p class="small muted" style="margin:12px 0 0"><b>Refunds:</b> within 7 days of purchase if units beyond the free trial (Unit 4 and up) haven't been used. Email <a href="mailto:admin@weenu.com?subject=A's%20SAT%20Words%20refund">admin@weenu.com</a> from your account email. <a href="/legal/refund.html" target="_blank" rel="noopener">Refund policy</a></p>
    ${DEMO?`<p class="small muted" style="margin-top:8px">Demo mode: purchases are simulated on this device.</p>`:""}</section>`}
function renderParent(){
  const L=tl(),today=studied(L),st=streak();
  app.innerHTML=`<div class="row" style="margin-top:22px"><h1 style="margin:0">${esc(nm())}'s progress</h1><button class="btn ghost" id="exitP" style="min-height:36px;padding:6px 12px;font-size:14px">Exit</button></div>
    <div class="pstatus ${today?"on":""}"><b>${today?"Studied today":"Not studied yet today"}</b>
      <span>${today?`${L.q||L.a||0} questions answered, ${L.n||0} of ${state.settings.daily} new words${L.a?`, ${Math.round(L.c/L.a*100)}% correct`:""}`:`Plan: ${state.settings.minutes} minutes and ${state.settings.daily} new words a day${st?`. Current streak: ${st} days`:""}`}</span></div>
    ${accountHTML()}
    ${journeyHTML()}
    <h2>This week</h2>${weekHTML()}
    <h2 style="margin-bottom:4px">Units</h2><p class="small muted" style="margin:0">Yellow is the current unit. Stars show boss rounds cleared.</p>
    ${unitMapHTML().replace('class="units"','class="units ro"')}
    ${progressHTML(true)}
    <h2>Settings</h2>
    <div class="spell" style="max-width:420px"><input id="nmIn" value="${esc(state.settings.name)}" placeholder="Student's first name" aria-label="Student's first name"><button class="btn ghost" id="nmGo">Save</button></div>
    <div class="actions" style="flex-wrap:wrap"><button class="btn ghost" id="pinReset">Change PIN</button>${DEMO?"":`<button class="btn ghost" id="signOut">Sign out</button>`}</div>`;
  document.getElementById("exitP").onclick=()=>{PARENT=false;tab="today";render()};
  document.getElementById("nmGo").onclick=()=>{state.settings.name=document.getElementById("nmIn").value.trim().slice(0,24);save();render()};
  document.getElementById("pinReset").onclick=()=>{state.settings.pin="";save();PARENT=false;render()};
  const so=document.getElementById("signOut");if(so)so.onclick=async()=>{await flush();await sb.auth.signOut()};
}
function renderLogin(){
  const g=USER&&USER.guest,tried=g&&Object.keys(state.srs).length>0;
  app.innerHTML=`<h1>${g?"Save progress and continue":"Sign in"}</h1>
    <p class="muted" style="margin:0 0 18px">${tried?"Words studied on this device move to your account when you sign in. ":""}Parents, use your own email. Your child studies on the same account, and your report stays behind a parent PIN.</p>
    <div class="spell" style="max-width:420px"><input id="em" type="email" autocomplete="email" placeholder="you@example.com" aria-label="Email"><button class="btn" id="emGo">Send link</button></div>
    <p class="small muted" id="emMsg" style="margin-top:10px">We'll email you a one-time sign-in link. No password needed.</p>
    ${g?`<p style="margin-top:22px"><button class="btn ghost" id="keepTrying">Keep trying without an account</button></p>`:""}`;
  const kt=document.getElementById("keepTrying");if(kt)kt.onclick=()=>{loginOpen=false;if(tab==="parent")tab="today";render();window.scrollTo(0,0)};
  const go=async()=>{const v=document.getElementById("em").value.trim();if(!/^\S+@\S+\.\S+$/.test(v))return;
    const {error}=await sb.auth.signInWithOtp({email:v,options:{emailRedirectTo:location.origin+location.pathname}});
    document.getElementById("emMsg").textContent=error?"Couldn't send the link. Check the address and try again.":"Check your inbox and open the link on this device."};
  document.getElementById("emGo").onclick=go;
}
function render(){
  document.body.classList.toggle("sess",!!S&&tab==="today"&&!!USER&&!(USER.guest&&loginOpen));
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  if(!READY){app.innerHTML=`<p class="muted" style="margin-top:28px">Loading…</p>`;return}
  if(!USER||(USER.guest&&(loginOpen||tab==="parent"))){renderLogin();return}
  if(tab==="parent"){if(S){S=null}PARENT?renderParent():renderParentGate();return}
  if(tab==="today"&&S)renderSession();else if(tab==="today")renderToday();else if(tab==="words")renderWords();else renderProgress();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;loginOpen=false;render();window.scrollTo(0,0)});
app.addEventListener("click",e=>{const si=e.target.closest("[data-signin]");if(si){S=null;loginOpen=true;render();window.scrollTo(0,0);return}const pu=e.target.closest("[data-parent-unlock]");if(pu){tab="parent";render();window.scrollTo(0,0);return}const bu=e.target.closest("[data-buy]");if(bu){buy(bu.dataset.buy);return}const s=e.target.closest("[data-say]");if(s){e.stopPropagation();speak(s.dataset.say);return}const m=e.target.closest("[data-morebtn]");if(m){e.stopPropagation();moreExamples(+m.dataset.morebtn,m.closest(".more"))}});
render();

</script>
