numerical","s":0,"src":"own","f":"Current affairs"},{"e":"One opinion is, that payment to the State should be in numerical proportion to pecuniary means.","c":"numerical","s":null,"src":"classic","a":"John Stuart Mill, Utilitarianism (1863)"},{"e":"With this natural enthusiasm, which is felt by a few only, there seems to mingle in Plato a sort of Pythagorean reverence for numbers and numerical proportion to which Aristotle is a stranger.","c":"numerical","s":null,"src":"classic","a":"Plato, The Republic (tr. Benjamin Jowett) (1871)"}]},{"w":"improbable","r":180,"s":[{"p":"adj","d":"not likely to be true or to happen"}],"x":[{"e":"Few generals expected the small garrison to survive the siege, yet its improbable defense held for months, forcing the invading army to retreat exhausted.","c":"improbable","s":0,"src":"own","f":"History"},{"e":"The fossil's odd combination of feathers and teeth seemed so improbable that researchers initially suspected a hoax before confirming it as a genuine transitional species.","c":"improbable","s":0,"src":"own","f":"Science"},{"e":"The narrator dismisses the letter as improbable, insisting that her long-lost brother could not possibly appear at the door after twenty silent years.","c":"improbable","s":0,"src":"own","f":"Literature"},{"e":"Sociologists found the community's rapid recovery from poverty improbable, since similar towns lacking outside investment usually stagnated for generations without such dramatic change.","c":"improbable","s":0,"src":"own","f":"Social science"},{"e":"Analysts called the startup's swift rise improbable, pointing out that it lacked funding, staff, and a working product just a year earlier.","c":"improbable","s":0,"src":"own","f":"Current affairs"},{"e":"The treaty's sudden, improbable success surprised diplomats who had spent years assuming the two rival kingdoms would never agree to anything at all.","c":"improbable","s":0,"src":"own","f":"History"},{"e":"An improbable chain of chemical accidents in the lab produced a compound no one had predicted, forcing scientists to revise their entire reaction model.","c":"improbable","s":0,"src":"own","f":"Science"},{"e":"In the fable, the tiny mouse's improbable rescue of the lion seems absurd at first, yet it teaches readers that small creatures can matter greatly.","c":"improbable","s":0,"src":"own","f":"Literature"},{"e":"The study's improbable finding, that isolated strangers cooperated more than close friends, forced psychologists to question long-held assumptions about trust and familiarity.","c":"improbable","s":0,"src":"own","f":"Social science"},{"e":"The improbable comeback of the nearly bankrupt transit agency surprised commuters, who had already resigned themselves to permanently reduced bus and train service.","c":"improbable","s":0,"src":"own","f":"Current affairs"},{"e":"It is not improbable that this one small quarry includes the only remaining record of the vegetation of Van Diemen's Land during one former epoch.","c":"improbable","s":null,"src":"classic","a":"Charles Darwin, The Voyage of the Beagle (1839)"},{"e":"‘If you put the question whether your ridiculous and improbable account was true or not, I am bound to say it’s confirmed.’","c":"improbable","s":null,"src":"classic","a":"Charles Dickens, Hard Times (1854)"}]},{"w":"emphatic","r":181,"s":[{"p":"adj","d":"expressed with force and clarity"},{"p":"adj","d":"clear and definite"}],"x":[{"e":"The queen's emphatic refusal to surrender startled her advisors, who had expected quiet negotiation rather than a forceful declaration delivered before the entire court.","c":"emphatic","s":0,"src":"own","f":"History"},{"e":"The researcher's emphatic warning about contamination risks, repeated three times in the report, convinced the lab to halt experiments until proper safeguards existed.","c":"emphatic","s":0,"src":"own","f":"Science"},{"e":"The old sailor spoke in emphatic bursts, pounding the table with each word until even the skeptical young passengers believed his tale of the storm.","c":"emphatic","s":0,"src":"own","f":"Literature"},{"e":"The therapist noticed that the client's emphatic denial, delivered louder than any other statement, actually signaled deep unresolved anxiety about the subject.","c":"emphatic","s":0,"src":"own","f":"Social science"},{"e":"The mayor issued an emphatic statement condemning the vandalism, her forceful tone leaving no ambiguity about the city's commitment to prosecuting those responsible.","c":"emphatic","s":0,"src":"own","f":"Current affairs"},{"e":"The election results were emphatic, showing such a clear and definite majority that even skeptical historians agreed no recount could have changed the outcome.","c":"emphatic","s":1,"src":"own","f":"History"},{"e":"Presenting her findings, the geologist gave an emphatic account of the fault line's danger, stressing each measurement so no colleague could doubt the risk.","c":"emphatic","s":0,"src":"own","f":"Science"},{"e":"By the play's final scene, the heroine's choice feels emphatic, a clear and definite break from her earlier hesitation that leaves no room for doubt.","c":"emphatic","s":1,"src":"own","f":"Literature"},{"e":"The survey produced an emphatic result: nearly every respondent's clear and definite preference for remote work over commuting, leaving little room for interpretation.","c":"emphatic","s":1,"src":"own","f":"Social science"},{"e":"During the debate, the candidate gave an emphatic response to critics, stressing each syllable to ensure viewers understood her position on the new policy.","c":"emphatic","s":0,"src":"own","f":"Current affairs"},{"e":"The coachman looked back and the guard looked back, and even the emphatic leader pricked up his ears and looked back, without contradicting.","c":"emphatic","s":null,"src":"classic","a":"Charles Dickens, A Tale of Two Cities (1859)"},{"e":"But Joe wouldn't hear of that, at all, and again opened his mouth very wide, and shook the form of a most emphatic word out of it.","c":"emphatic","s":null,"src":"classic","a":"Charles Dickens, Great Expectations (1861)"}]},{"w":"inexplicable","r":182,"s":[{"p":"adj","d":"impossible to explain or account for"}],"x":[{"e":"Historians still find the sudden abandonment of the ancient city inexplicable, since no record mentions war, famine, or disaster that might explain its emptiness.","c":"inexplicable","s":0,"src":"own","f":"History"},{"e":"The sudden disappearance of the frog population remained inexplicable until ecologists finally traced it to a fungal disease no one had previously documented.","c":"inexplicable","s":0,"src":"own","f":"Science"},{"e":"The narrator describes an inexplicable dread that settles over the house each evening, a feeling she cannot trace to any object or memory.","c":"inexplicable","s":0,"src":"own","f":"Literature"},{"e":"The inexplicable gap between reported happiness and actual life satisfaction puzzled researchers, who could not identify any single factor driving the mismatch.","c":"inexplicable","s":0,"src":"own","f":"Social science"},{"e":"Residents reported an inexplicable drop in water pressure across the neighborhood, prompting engineers to investigate a system with no obvious leak or failure.","c":"inexplicable","s":0,"src":"own","f":"Current affairs"},{"e":"The general's inexplicable decision to retreat from a winning position puzzled his own officers, who could find no strategic reason for abandoning the field.","c":"inexplicable","s":0,"src":"own","f":"History"},{"e":"Readings from the sensor showed an inexplicable spike in temperature, one that no known chemical reaction in the sealed chamber could account for.","c":"inexplicable","s":0,"src":"own","f":"Science"},{"e":"In the play, the servant's inexplicable loyalty to a cruel master baffles the other characters, who see no obvious reward for such devotion.","c":"inexplicable","s":0,"src":"own","f":"Literature"},{"e":"Economists called the sudden shift in consumer spending inexplicable, since no policy change or price shift seemed capable of causing such a swing.","c":"inexplicable","s":0,"src":"own","f":"Social science"},{"e":"The city's inexplicable delay in repairing the bridge frustrated commuters, since officials offered no clear reason for the stalled, fully funded project.","c":"inexplicable","s":0,"src":"own","f":"Current affairs"},{"e":"She must have had some good qualities or it's quite inexplicable.... She had no money either and he wouldn't have considered her money....","c":"inexplicable","s":null,"src":"classic","a":"Fyodor Dostoevsky, Crime and Punishment (tr. Constance Garnett) (1866)"},{"e":"There is much, as Dr. Richardson well remarks, utterly inexplicable connected with the different degrees of shyness and care with which birds conceal their nests.","c":"inexplicable","s":null,"src":"classic","a":"Charles Darwin, The Voyage of the Beagle (1839)"}]},{"w":"tumultuous","r":183,"s":[{"p":"adj","d":"loud, confused, and disorderly"},{"p":"adj","d":"marked by great change or conflict"}],"x":[{"e":"When the treaty terms were announced, the tumultuous crowd outside the palace shouted, jostled, and drowned out the herald's voice entirely.","c":"tumultuous","s":0,"src":"own","f":"History"},{"e":"The volcano's tumultuous eruption filled the valley with roaring noise, falling ash, and chaos, forcing scientists to abandon their instruments and flee.","c":"tumultuous","s":0,"src":"own","f":"Science"},{"e":"Inside the crowded tavern, the tumultuous din of laughter, clinking mugs, and shouted toasts made it nearly impossible for the traveler to think.","c":"tumultuous","s":0,"src":"own","f":"Literature"},{"e":"The town hall meeting grew tumultuous, with residents interrupting one another so loudly that the moderator struggled to restore any order.","c":"tumultuous","s":0,"src":"own","f":"Social science"},{"e":"Outside the courthouse, a tumultuous demonstration erupted, with chanting protesters and blaring horns making the officers' announcements almost impossible to hear.","c":"tumultuous","s":0,"src":"own","f":"Current affairs"},{"e":"The decade following the empire's collapse proved tumultuous, as rival factions seized territory and old alliances shattered within a single generation.","c":"tumultuous","s":1,"src":"own","f":"History"},{"e":"The storm surge became tumultuous, with waves crashing so violently against the seawall that researchers could barely hear their own instruments.","c":"tumultuous","s":0,"src":"own","f":"Science"},{"e":"Their tumultuous marriage, filled with reconciliations and bitter quarrels, drove much of the novel's tension long before the final, quiet chapter.","c":"tumultuous","s":1,"src":"own","f":"Literature"},{"e":"Sociologists describe adolescence as a tumultuous stage, since rapid shifts in identity and peer relationships often reshape a young person's entire worldview.","c":"tumultuous","s":1,"src":"own","f":"Social science"},{"e":"The city council session turned tumultuous when dozens of residents began shouting over each other about the proposed transit budget.","c":"tumultuous","s":0,"src":"own","f":"Current affairs"},{"e":"They did not appear rich, but they were contented and happy; their feelings were serene and peaceful, while mine became every day more tumultuous.","c":"tumultuous","s":null,"src":"classic","a":"Mary Shelley, Frankenstein (1818)"},{"e":"Tumultuous applause followed but received an unexpected check, for the cot bed, on which the dress circle was built, suddenly shut up and extinguished the enthusiastic audience.","c":"Tumultuous","s":null,"src":"classic","a":"Louisa May Alcott, Little Women (1868)"}]},{"w":"attentive","r":184,"s":[{"p":"adj","d":"paying close attention"},{"p":"adj","d":"considerate of others' needs"}],"x":[{"e":"The royal scribe remained attentive throughout the trial, recording every word so precisely that historians later relied on his account.","c":"attentive","s":0,"src":"own","f":"History"},{"e":"The attentive lab technician noticed a faint discoloration in the sample that her colleagues, distracted by other tasks, had missed entirely.","c":"attentive","s":0,"src":"own","f":"Science"},{"e":"The narrator sat attentive at the window, straining to catch every creak and whisper drifting from the abandoned house next door.","c":"attentive","s":0,"src":"own","f":"Literature"},{"e":"During the memory experiment, attentive participants tracked each flashing symbol so closely that even brief distractions caused their recall scores to drop.","c":"attentive","s":0,"src":"own","f":"Social science"},{"e":"Attentive residents tracked the city's water-quality reports for weeks, catching a small contamination spike that officials had initially dismissed.","c":"Attentive","s":0,"src":"own","f":"Current affairs"},{"e":"Unlike his predecessor, the young governor proved attentive to the villagers' complaints, personally visiting flooded farms before ordering any relief.","c":"attentive","s":1,"src":"own","f":"History"},{"e":"Field biologists stayed attentive for hours, watching the burrow's entrance closely to catch the rare moment the fox emerged.","c":"attentive","s":0,"src":"own","f":"Science"},{"e":"Though gruff in speech, the old innkeeper was quietly attentive, always leaving extra blankets for guests who arrived shivering and exhausted.","c":"attentive","s":1,"src":"own","f":"Literature"},{"e":"Effective mentors are attentive to students' unspoken frustrations, adjusting their guidance long before a struggling learner voices any complaint.","c":"attentive","s":1,"src":"own","f":"Social science"},{"e":"During the outbreak, attentive commuters followed every transit advisory closely, rerouting their trips as soon as new alerts appeared online.","c":"attentive","s":0,"src":"own","f":"Current affairs"},{"e":"He was in his usual morning dress, and his face (which Mr. Lorry could distinctly see), though still very pale, was calmly studious and attentive.","c":"attentive","s":null,"src":"classic","a":"Charles Dickens, A Tale of Two Cities (1859)"},{"e":"It takes him a long time to say this, and few but an experienced and attentive listener could hear, or, hearing, understand him.","c":"attentive","s":null,"src":"classic","a":"Charles Dickens, Bleak House (1853)"}]},{"w":"considerate","r":185,"s":[{"p":"adj","d":"thoughtful of others' feelings and needs"}],"x":[{"e":"The general was surprisingly considerate toward captured soldiers, ensuring they received food and medical care despite the war's brutal conditions.","c":"considerate","s":0,"src":"own","f":"History"},{"e":"The lead researcher was considerate of her junior colleagues, scheduling experiments around their exam periods instead of demanding late-night lab shifts.","c":"considerate","s":0,"src":"own","f":"Science"},{"e":"The governess proved unexpectedly considerate, softening her lessons whenever she noticed the orphaned child's eyes brimming with tears.","c":"considerate","s":0,"src":"own","f":"Literature"},{"e":"Considerate managers who ask employees about workload before assigning overtime tend to see lower turnover and stronger team morale.","c":"Considerate","s":0,"src":"own","f":"Social science"},{"e":"The new apartment complex encourages considerate behavior, asking residents to keep noise low after dark out of respect for neighbors.","c":"considerate","s":0,"src":"own","f":"Current affairs"},{"e":"Historians note that the queen's considerate treatment of famine-stricken provinces, including opening royal granaries, won her lasting loyalty among peasants.","c":"considerate","s":0,"src":"own","f":"History"},{"e":"Wildlife photographers who are considerate of nesting birds keep a respectful distance, avoiding flashes or noises that might disturb the fragile eggs.","c":"considerate","s":0,"src":"own","f":"Science"},{"e":"Even amid his own grief, the old sailor remained considerate, checking constantly whether the frightened cabin boy needed comfort or rest.","c":"considerate","s":0,"src":"own","f":"Literature"},{"e":"Economists studying workplace culture found that considerate supervisors, who acknowledge staff burnout, often outperform stricter colleagues in productivity over time.","c":"considerate","s":0,"src":"own","f":"Social science"},{"e":"Considerate cyclists now signal turns clearly and slow near pedestrians, a small courtesy city planners hope will reduce shared-path accidents.","c":"Considerate","s":0,"src":"own","f":"Current affairs"},{"e":"Miss Gradgrind readily permitting Mrs. Sparsit to do anything she pleased, that considerate lady made the beverage, and handed it to Mr. Bounderby.","c":"considerate","s":null,"src":"classic","a":"Charles Dickens, Hard Times (1854)"},{"e":"I know no man more likely than Mr. Knightley to do the sort of thing--to do any thing really good-natured, useful, considerate, or benevolent.","c":"considerate","s":null,"src":"classic","a":"Jane Austen, Emma (1815)"}]},{"w":"illuminate","r":186,"s":[{"p":"v","d":"to make something clear or easier to understand"},{"p":"v","d":"to light up"}],"x":[{"e":"Newly translated letters illuminate the king's private doubts, revealing a hesitant ruler quite different from the confident figure in official portraits.","c":"illuminate","s":0,"src":"own","f":"History"},{"e":"The tracer experiment helped illuminate how nutrients travel through soil, clarifying a process that had puzzled agronomists for decades.","c":"illuminate","s":0,"src":"own","f":"Science"},{"e":"A single recurring image of a locked door helps illuminate the protagonist's hidden fear of abandonment throughout the novel.","c":"illuminate","s":0,"src":"own","f":"Literature"},{"e":"The longitudinal survey helps illuminate why some communities recover from economic shocks faster than others, clarifying a pattern researchers had only guessed at before.","c":"illuminate","s":0,"src":"own","f":"Social science"},{"e":"The leaked report helped illuminate how the agency's funding decisions were actually made, clarifying a process long criticized as opaque.","c":"illuminate","s":0,"src":"own","f":"Current affairs"},{"e":"During the coronation, hundreds of torches were arranged to illuminate the cathedral's vast interior long after sunset.","c":"illuminate","s":1,"src":"own","f":"History"},{"e":"Fossil evidence from the site helped illuminate the creature's diet, resolving a debate that earlier, incomplete skeletons had left unsettled.","c":"illuminate","s":0,"src":"own","f":"Science"},{"e":"Moonlight seemed to illuminate the garden just as the ghost appeared, casting long silver shadows across the trembling heroine's path.","c":"illuminate","s":1,"src":"own","f":"Literature"},{"e":"Streetlamps were installed to illuminate the plaza, allowing evening markets to continue safely well past dusk.","c":"illuminate","s":1,"src":"own","f":"Social science"},{"e":"Public forums this month aim to illuminate the city's new zoning proposal, clarifying details that many residents found confusing.","c":"illuminate","s":0,"src":"own","f":"Current affairs"},{"e":"In the thronged restaurant, taking their places about Mrs. Bry's illuminated board, their confidence seemed to gain support from the familiarity of their surroundings.","c":"illuminated","s":null,"src":"classic","a":"Edith Wharton, The House of Mirth (1905)"},{"e":"She can look up and see the drawing-room windows illuminated, and, at about nine o'clock, the chamber in the upper story where Georgy sleeps.","c":"illuminated","s":null,"src":"classic","a":"William Makepeace Thackeray, Vanity Fair (1848)"}]},{"w":"reassure","r":187,"s":[{"p":"v","d":"to say or do something to remove someone's fears or doubts"}],"x":[{"e":"After the treaty collapsed, the ambassador tried to reassure anxious citizens that soldiers would not march through the capital again.","c":"reassure","s":0,"src":"own","f":"History"},{"e":"To reassure worried residents near the fault line, geologists explained that the small tremors likely released pressure rather than signaling a larger quake.","c":"reassure","s":0,"src":"own","f":"Science"},{"e":"The old sailor placed a hand on the boy's shoulder, hoping to reassure him that the storm outside would soon pass.","c":"reassure","s":0,"src":"own","f":"Literature"},{"e":"The therapist worked to reassure the anxious teenager that occasional intrusive thoughts do not indicate a serious mental illness.","c":"reassure","s":0,"src":"own","f":"Social science"},{"e":"City officials issued a statement to reassure residents that the water supply remained safe despite the nearby pipeline leak.","c":"reassure","s":0,"src":"own","f":"Current affairs"},{"e":"Following the failed harvest, village elders sought to reassure frightened families that grain stores from previous years would prevent starvation.","c":"reassure","s":0,"src":"own","f":"History"},{"e":"The veterinarian moved slowly to reassure the trembling animal, speaking softly until its rapid breathing finally began to calm.","c":"reassure","s":0,"src":"own","f":"Science"},{"e":"In the final act, the ghost's calm words reassure the trembling prince that his father's death will not go unanswered.","c":"reassure","s":0,"src":"own","f":"Literature"},{"e":"Economists tried to reassure jittery investors, noting that the market dip resembled past fluctuations that corrected themselves within weeks.","c":"reassure","s":0,"src":"own","f":"Social science"},{"e":"The airline's spokesperson attempted to reassure nervous travelers, explaining that the software glitch had already been fully resolved.","c":"reassure","s":0,"src":"own","f":"Current affairs"},{"e":"It inspired me with new fortitude and new calmness to find that it was I who was under the necessity of reassuring him.","c":"reassuring","s":null,"src":"classic","a":"Charles Dickens, Bleak House (1853)"},{"e":"I shall consider myself happy, Pulcheria Alexandrovna, if it is possible for you to convince me of an opposite conclusion, and thereby considerately reassure me.","c":"reassure","s":null,"src":"classic","a":"Fyodor Dostoevsky, Crime and Punishment (tr. Constance Garnett) (1866)"}]},{"w":"inquisitive","r":188,"s":[{"p":"adj","d":"curious and eager to learn"}],"x":[{"e":"The young apprentice grew famous for asking inquisitive questions, often pressing scholars until they admitted the limits of their knowledge.","c":"inquisitive","s":0,"src":"own","f":"History"},{"e":"The inquisitive graduate student spent nights in the lab, endlessly tweaking variables just to see how the reaction might change.","c":"inquisitive","s":0,"src":"own","f":"Science"},{"e":"The narrator's inquisitive nature drove her to sneak into the locked attic, desperate to uncover the house's buried secrets.","c":"inquisitive","s":0,"src":"own","f":"Literature"},{"e":"Developmental psychologists note that inquisitive toddlers, constantly poking and questioning their surroundings, tend to build vocabulary more quickly than passive peers.","c":"inquisitive","s":0,"src":"own","f":"Social science"},{"e":"An inquisitive intern kept probing the company's data practices until executives finally answered questions they had long avoided.","c":"inquisitive","s":0,"src":"own","f":"Current affairs"},{"e":"Even as a child, the future explorer was so inquisitive that she interrogated sailors for hours about distant, uncharted coastlines.","c":"inquisitive","s":0,"src":"own","f":"History"},{"e":"Octopuses are remarkably inquisitive creatures, often prying open containers and examining unfamiliar objects long after any reward has vanished.","c":"inquisitive","s":0,"src":"own","f":"Science"},{"e":"Readers admire the detective's inquisitive mind, which refuses to accept a simple explanation while so many details remain unexplained.","c":"inquisitive","s":0,"src":"own","f":"Literature"},{"e":"Sociologists describe the inquisitive newcomer who peppered neighbors with questions, gradually mapping the community's unspoken rules and hidden alliances.","c":"inquisitive","s":0,"src":"own","f":"Social science"},{"e":"The museum's new exhibit rewards inquisitive visitors, hiding small clues that only careful, curious observers ever manage to notice.","c":"inquisitive","s":0,"src":"own","f":"Current affairs"},{"e":"Now this lady was a thin, yellow spinster, with a sharp nose and inquisitive eyes, who saw everything and gossiped about all she saw.","c":"inquisitive","s":null,"src":"classic","a":"Louisa May Alcott, Little Women (1868)"},{"e":"And there passed before his mind a whole series of these mettlesome, vigorous, self-confident men, who always and everywhere drew his inquisitive attention in spite of himself.","c":"inquisitive","s":null,"src":"classic","a":"Leo Tolstoy, Anna Karenina (tr. Constance Garnett) (1878)"}]},{"w":"tyrannical","r":189,"s":[{"p":"adj","d":"using power cruelly and unjustly"}],"x":[{"e":"The emperor's tyrannical rule left little room for dissent, as anyone who questioned his decrees risked exile or execution.","c":"tyrannical","s":0,"src":"own","f":"History"},{"e":"Researchers noted that the alpha wolf's tyrannical control over the pack collapsed once younger, stronger rivals challenged its dominance.","c":"tyrannical","s":0,"src":"own","f":"Science"},{"e":"The novel's tyrannical headmaster ruled the boarding school through fear, punishing minor mistakes as though they were grave crimes.","c":"tyrannical","s":0,"src":"own","f":"Literature"},{"e":"Organizational psychologists warn that a tyrannical manager, who punishes disagreement and demands blind obedience, quickly erodes employee trust and morale.","c":"tyrannical","s":0,"src":"own","f":"Social science"},{"e":"Critics accused the platform's founder of tyrannical decision-making after he banned dissenting employees from company forums without explanation.","c":"tyrannical","s":0,"src":"own","f":"Current affairs"},{"e":"Colonial officials grew so tyrannical that local merchants began smuggling goods simply to escape their arbitrary and crushing taxes.","c":"tyrannical","s":0,"src":"own","f":"History"},{"e":"In some wolf studies, researchers once described pack leaders as tyrannical, though later work showed they rarely rule by cruelty and usually lead as parents.","c":"tyrannical","s":0,"src":"own","f":"Science"},{"e":"By the third act, the once-beloved king has become tyrannical, silencing advisors who dare to question his ruinous decisions.","c":"tyrannical","s":0,"src":"own","f":"Literature"},{"e":"Sociological studies of small communities show that tyrannical leadership, however efficient at first, often provokes quiet resistance over time.","c":"tyrannical","s":0,"src":"own","f":"Social science"},{"e":"Protesters denounced the regime as tyrannical, citing its habit of jailing journalists who published even mild criticism of officials.","c":"tyrannical","s":0,"src":"own","f":"Current affairs"},{"e":"He who is of a tyrannical nature, and instead of leading a private life has been cursed with the further misfortune of being a public tyrant.","c":"tyrannical","s":null,"src":"classic","a":"Plato, The Republic (tr. Benjamin Jowett) (1871)"},{"e":"The generous nature of Safie was outraged by this command; she attempted to expostulate with her father, but he left her angrily, reiterating his tyrannical mandate.","c":"tyrannical","s":null,"src":"classic","a":"Mary Shelley, Frankenstein (1818)"}]},{"w":"inanimate","r":190,"s":[{"p":"adj","d":"not alive; lifeless"}],"x":[{"e":"Archaeologists unearthed inanimate statues so lifelike that early visitors reportedly mistook the carved stone figures for sleeping guards.","c":"inanimate","s":0,"src":"own","f":"History"},{"e":"Chemists explained that although crystals can grow and form patterns, they remain inanimate matter without metabolism or reproduction.","c":"inanimate","s":0,"src":"own","f":"Science"},{"e":"The child spoke tenderly to her inanimate doll, insisting it could hear every secret she whispered before bedtime.","c":"inanimate","s":0,"src":"own","f":"Literature"},{"e":"Psychologists studying attachment found that lonely participants sometimes formed d the downtown streets.","c":"uneventful","s":0,"src":"own","f":"Current affairs"},{"e":"Compared to the chaos of the revolution, the new government's first year in power was surprisingly uneventful, marked by routine meetings and minor reforms.","c":"uneventful","s":0,"src":"own","f":"History"},{"e":"Despite predictions of turbulence, the storm's passage over the coastline was uneventful, leaving the dunes and shoreline largely undisturbed.","c":"uneventful","s":0,"src":"own","f":"Science"},{"e":"The old sailor's logbook recorded page after page as uneventful, though the narrator suspected he simply chose not to mention the storms.","c":"uneventful","s":0,"src":"own","f":"Literature"},{"e":"In interviews, retirees often characterized their careers as uneventful, having avoided the layoffs and upheavals that shaped their coworkers' lives.","c":"uneventful","s":0,"src":"own","f":"Social science"},{"e":"The software rollout was uneventful, with technicians noting only a few minor glitches that were fixed before most users even logged in.","c":"uneventful","s":0,"src":"own","f":"Current affairs"},{"e":"While these internal revolutions were going on, her external life had been as busy and uneventful as usual, and if she sometimes looked serious or a little sad no one observed it but Professor Bhaer.","c":"uneventful","s":null,"src":"classic","a":"Louisa May Alcott, Little Women (1868)"}]},{"w":"habitable","r":194,"s":[{"p":"adj","d":"suitable for living in"}],"x":[{"e":"After draining the swamp, settlers finally declared the lowland habitable, clearing space for the small cottages that would become the village.","c":"habitable","s":0,"src":"own","f":"History"},{"e":"Astronomers search for planets within a narrow orbital zone where liquid water might exist, making the surface potentially habitable.","c":"habitable","s":0,"src":"own","f":"Science"},{"e":"In the poem, the abandoned lighthouse is described as barely habitable, its broken windows letting in wind, rain, and d escribing the data breach as a storm that swept through the company's servers overnight.","c":"figurative","s":0,"src":"own","f":"Current affairs"},{"e":"In reply to this, he made use of the figurative expression--which has something Eastern about it--that he had never seen the colour of my money.","c":"figurative","s":null,"src":"classic","a":"Charles Dickens, Bleak House (1853)"},{"e":"The figurative association was mistaken for a real one; and thus the three latter divisions of the Platonic proportion were constructed.","c":"figurative","s":null,"src":"classic","a":"Plato, The Republic (tr. Benjamin Jowett) (1871)"}]},{"w":"preposterous","r":215,"s":[{"p":"adj","d":"absurd and ridiculous; contrary to reason"}],"x":[{"e":"Advisors dismissed the general's plan to invade in midwinter without supplies as preposterous, warning that the army would freeze before reaching the border.","c":"preposterous","s":0,"src":"own","f":"History"},{"e":"The hypothesis that continents drift across the ocean floor once seemed preposterous, since no known force appeared strong enough to move solid rock that far.","c":"preposterous","s":0,"src":"own","f":"Science"},{"e":"The narrator finds his uncle's insistence that ghosts manage the family estate utterly preposterous, yet he cannot explain the flickering lights in the empty study.","c":"preposterous","s":0,"src":"own","f":"Literature"},{"e":"Some early theories claiming that skull shape determined intelligence now appear preposterous, having been thoroughly discredited by rigorous, controlled psychological research.","c":"preposterous","s":0,"src":"own","f":"Social science"},{"e":"Critics called the proposal to ban all bicycles from city streets preposterous, arguing it would worsen traffic and undermine years of environmental progress.","c":"preposterous","s":0,"src":"own","f":"Current affairs"},{"e":"Court records show the treasurer once proposed melting the kingdom's coinage to fund a parade, a scheme so preposterous that ministers iterate","s":0,"src":"own","f":"Science"},{"e":"Growing anxious that no one believed him, the young sailor would reiterate his sighting of the storm, repeating the details to anyone who passed.","c":"reiterate","s":0,"src":"own","f":"Literature"},{"e":"When negotiations stalled, the mediator chose to reiterate both parties' shared goals, repeating the common ground to ease mounting distrust between them.","c":"reiterate","s":0,"src":"own","f":"Social science"},{"e":"City officials continue to reiterate that the water remains safe to drink, repeating the assurance at every town hall meeting this month.","c":"reiterate","s":0,"src":"own","f":"Current affairs"},{"e":"During the truce negotiations, the envoy would reiterate the queen's demand for tribute each time the opposing delegation tried to change the subject.","c":"reiterate","s":0,"src":"own","f":"History"},{"e":"The panel asked the geologist to reiterate her findings about the fault line, since several reporters had missed the point during her first explanation.","c":"reiterate","s":0,"src":"own","f":"Science"},{"e":"The chorus seems designed to reiterate the play's central warning, echoing the same somber lines after every scene of reckless ambition.","c":"reiterate","s":0,"src":"own","f":"Literature"},{"e":"To calm worried residents, the economist would reiterate that inflation was slowing, restating the same reassurance whenever new rumors spread through the community.","c":"reiterate","s":0,"src":"own","f":"Social science"},{"e":"The company's spokesperson had to reiterate the recall notice several times after early reports left many customers confused about the deadline.","c":"reiterate","s":0,"src":"own","f":"Current affairs"},{"e":"The generous nature of Safie was outraged by this command; she attempted to expostulate with her father, but he left her angrily, reiterating his tyrannical mandate.","c":"reiterating","s":null,"src":"classic","a":"Mary Shelley, Frankenstein (1818)"},{"e":"On these few steps o ite academic audience.","c":"audacious","s":1,"src":"own","f":"Social science"},{"e":"Facing budget cuts, the school board approved an audacious initiative to give every student a laptop within a single year.","c":"audacious","s":0,"src":"own","f":"Current affairs"},{"e":"This audacious statement caused Raggles and the other personages present to look at one another with a wild surprise, and with it Rebecca left them.","c":"audacious","s":null,"src":"classic","a":"William Makepeace Thackeray, Vanity Fair (1848)"},{"e":"War rages yet with the audacious Boythorn, though at uncertain intervals, and now hotly, and now coolly, flickering like an unsteady fire.","c":"audacious","s":null,"src":"classic","a":"Charles Dickens, Bleak House (1853)"}]},{"w":"scandalous","r":218,"s":[{"p":"adj","d":"shocking and causing public outrage"}],"x":[{"e":"Rumors of the minister's scandalous bribery scheme spread through the capital, forcing him to resign before the trial even began.","c":"scandalous","s":0,"src":"own","f":"History"},{"e":"The journal's scandalous decision to publish fabricated results without verification outraged researchers who had trusted its rigorous review process.","c":"scandalous","s":0,"src":"own","f":"Science"},{"e":"The narrator's scandalous confession, delivered calmly at the dinner party, silenced every guest who had once considered her beyond reproach.","c":"scandalous","s":0,"src":"own","f":"Literature"},{"e":"Sociologists studied how a scandalous rumor, even if false, can permanently damage a person's standing within a tight community.","c":"scandalous","s":0,"src":"own","f":"Social science"},{"e":"The city council faced scandalous allegations of misusing public funds, sparking protests and demands for an independent inquiry immediately.","c":"scandalous","s":0,"src":"own","f":"Current affairs"},{"e":"The queen's scandalous affair with a court musician became the subject of gossip in every noble household for years.","c":"scandalous","s":0,"src":"own","f":"History"},{"e":"News that the lab had falsified its safety data struck the scientific community as scandalous, prompting an immediate investigation.","c":"scandalous","s":0,"src":"own","f":"Science"},{"e":"Townsfolk in the play consider the heroine's refusal to marry scandalous, whispering about her defiance at every gathering.","c":"scandalous","s":0,"src":"own","f":"Literature"},{"e":"The economist's scandalous proposal to tax inheritance at a steep rate provoked outrage among wealthy families across the country.","c":"scandalous","s":0,"src":"own","f":"Social science"},{"e":"A scandalous leak revealed that the company had known about the safety defect for months before alerting the public.","c":"scandalous","s":0,"src":"own","f":"Current affairs"},{"e":"If I would not go for the sake of your father, I should think it scandalous to go for the sake of his heir.","c":"scandalous","s":null,"src":"classic","a":"Jane Austen, Persuasion (1817)"},{"e":"The order he keeps is scandalous, that's what, and he neglects the young fry and puts all his time on those big scholars he's getting ready for Queen's.","c":"scandalous","s":null,"src":"classic","a":"L. M. Montgomery, Anne of Green Gables (1908)"}]},{"w":"prevalence","r":219,"s":[{"p":"n","d":"how widespread or common something is"}],"x":[{"e":"Medieval chroniclers noted the prevalence of famine across the region, recording how few villages escaped several consecutive seasons of failed harvests.","c":"prevalence","s":0,"src":"own","f":"History"},{"e":"Marine biologists documented the prevalence of a particular coral bleaching pattern, finding that nearly every reef surveyed showed the same discoloration.","c":"prevalence","s":0,"src":"own","f":"Science"},{"e":"The narrator dwells on the prevalence of decay throughout the crumbling estate, describing mold and rust in nearly every room she enters.","c":"prevalence","s":0,"src":"own","f":"Literature"},{"e":"Linguists analyzing text messages noted the prevalence of abbreviated spellings, since nearly every sample contained shortened words instead of full ones.","c":"prevalence","s":0,"src":"own","f":"Social science"},{"e":"Environmental groups pointed to the prevalence of electric scooters downtown, observing that they now outnumbered bicycles on most city streets.","c":"prevalence","s":0,"src":"own","f":"Current affairs"},{"e":"Archivists studying trade ledgers were struck by the prevalence of counterfeit coins circulating throughout the empire's busiest ports during that turbulent decade.","c":"prevalence","s":0,"src":"own","f":"History"},{"e":"A team of botanists measured the prevalence of drought-resistant genes among desert shrubs, noting that almost every surviving plant carried the trait.","c":"prevalence","s":0,"src":"own","f":"Science"},{"e":"Critics have long remarked on the prevalence of storm imagery in the poet's work, since tempests appear in nearly every verse she wrote.","c":"prevalence","s":0,"src":"own","f":"Literature"},{"e":"Economists tracking informal lending noted the prevalence of handshake agreements, since formal contracts remained rare even in large transactions.","c":"prevalence","s":0,"src":"own","f":"Social science"},{"e":"A recent survey highlighted the prevalence of remote work arrangements, with many offices now nearly empty on weekday afternoons.","c":"prevalence","s":0,"src":"own","f":"Current affairs"},{"e":"But the universal and extreme indignation which it inspires is itself a proof of the energy and prevalence of the contrary sentiment.","c":"prevalence","s":null,"src":"classic","a":"Hamilton, Madison, Jay, The Federalist Papers (1788)"},{"e":"In the disorderly state of Europe, during the prevalence of the feudal government, the sovereign was obliged to content himself with taxing those who were too weak to refuse to pay taxes.","c":"prevalence","s":null,"src":"classic","a":"Adam Smith, The Wealth of Nations (1776)"}]},{"w":"concede","r":220,"s":[{"p":"v","d":"to admit that something is true, of e consciousness.","c":"metaphysical","s":0,"src":"own","f":"Current affairs"},{"e":"Some critics dismissed the scholar's later writings as too metaphysical, complaining that they abandoned practical politics for abstract speculation.","c":"metaphysical","s":1,"src":"own","f":"History"},{"e":"Biologists studying near-death experiences cautiously avoid metaphysical claims about an afterlife, restricting themselves instead to measurable changes in brain activity.","c":"metaphysical","s":0,"src":"own","f":"Science"},{"e":"Reviewers praised the novel's metaphysical passages, though some readers found the lengthy, abstract musings distracted from the plot's momentum.","c":"metaphysical","s":1,"src":"own","f":"Literature"},{"e":"Some sociological theories remain so metaphysical that they resist testing, offering elegant abstractions rather than measurable, falsifiable claims.","c":"metaphysical","s":1,"src":"own","f":"Social science"},{"e":"Public discussions of consciousness research often drift into metaphysical territory, addressing existence and awareness rather than measurable brain activity.","c":"metaphysical","s":0,"src":"own","f":"Current affairs"},{"e":"Should you ever be athirst in the great American desert, try this experiment, if your caravan happen to be supplied with a metaphysical professor.","c":"metaphysical","s":null,"src":"classic","a":"Herman Melville, Moby-Dick (1851)"},{"e":"Her father liked the metaphysical streak which had unconsciously got into it, so that was allowed to remain though she had her doubts about it.","c":"metaphysical","s":null,"src":"classic","a":"Louisa May Alcott, Little Women (1868)"}]},{"w":"illustrious","r":223,"s":[{"p":"adj","d":"famous and admired for past achievements"}],"x":[{"e":"Though the dynasty eventually collapsed in disgrace, its founder remained an illustrious ruler, celebrated centuries later for uniting warring provinces.","c":"illustrious","s":0,"src":"own","f":"History"},{"e":"Long after her death, the chemist rception.","c":"momentous","s":0,"src":"own","f":"Social science"},{"e":"Community leaders called the vote to fund the new transit system momentous, calling it a turning point for the region.","c":"momentous","s":0,"src":"own","f":"Current affairs"},{"e":"Meanwhile, in his conversation with Raffles, he had learned something momentous, something which entered actively into the struggle of his longings and terrors.","c":"momentous","s":null,"src":"classic","a":"George Eliot, Middlemarch (1871)"},{"e":"These things passed through Newland Archer's mind a week later as he watched the Countess Olenska enter the van der Luyden drawing-room on the evening of the momentous dinner.","c":"momentous","s":null,"src":"classic","a":"Edith Wharton, The Age of Innocence (1920)"}]},{"w":"delirious","r":245,"s":[{"p":"adj","d":"in a confused state caused by illness"},{"p":"adj","d":"wildly excited or happy"}],"x":[{"e":"By the third day of fever, the wounded soldier was delirious, muttering names no one in the camp recognized.","c":"delirious","s":0,"src":"own","f":"History"},{"e":"The infected patient grew delirious, unable to distinguish the hospital room from the childhood home he kept describing.","c":"delirious","s":0,"src":"own","f":"Science"},{"e":"Burning with fever, the novel's heroine lies delirious for days, murmuring fragments of a letter she never sent.","c":"delirious","s":0,"src":"own","f":"Literature"},{"e":"Researchers noted that extreme sleep deprivation left volunteers delirious, confusing simple instructions with vivid, half-formed dreams.","c":"delirious","s":0,"src":"own","f":"Social science"},{"e":"Health officials warned that the untreated illness had left several patients delirious, disoriented, and unable to recognize their families.","c":"delirious","s":0,"src":"own","f":"Current affairs"},{"e":"News of the surprising victory left the crowd delirious, dancing through the streets long into the night.","c":"delirious","s":1,"src":"own","f":"History"},{"e":"Sev ire cities.","c":"malignant","s":0,"src":"own","f":"History"},{"e":"Pathologists confirmed the mass was malignant, since biopsy samples revealed cells rapidly invading and spreading into surrounding healthy tissue.","c":"malignant","s":0,"src":"own","f":"Science"},{"e":"In the closing chapter, the heroine learns her illness is malignant, forcing her to confront mortality sooner than she had ever imagined.","c":"malignant","s":0,"src":"own","f":"Literature"},{"e":"Public health researchers warned that the malignant outbreak, spreading unchecked through the dense neighborhood, threatened to strain the fragile clinic system.","c":"malignant","s":0,"src":"own","f":"Social science"},{"e":"Health officials report that a malignant fungal infection is spreading among bat colonies, threatening populations already weakened by habitat loss.","c":"malignant","s":0,"src":"own","f":"Current affairs"},{"e":"The exiled minister nursed a malignant grudge against the king, plotting for years to see his former patron ruined and disgraced.","c":"malignant","s":1,"src":"own","f":"History"},{"e":"The newly identified fungal strain proved malignant, spreading through orchard roots and killing entire rows of apple trees within weeks.","c":"malignant","s":0,"src":"own","f":"Science"},{"e":"The narrator's stepmother wore a pleasant smile, but her malignant asides revealed a quiet, calculated desire to see the girl fail.","c":"malignant","s":1,"src":"own","f":"Literature"},{"e":"Psychologists studying workplace bullying describe a malignant envy that drives some employees to sabotage colleagues rather than admit their own shortcomings.","c":"malignant","s":1,"src":"own","f":"Social science"},{"e":"City health officials issued alerts about a malignant strain of drug-resistant bacteria circulating through hospitals, since standard antibiotics failed to halt its rapid spread.","c":"malignant","s":0,"src":"own","f":"Current affairs"},{"e":"It turned out that the Jeroboam had a malignant epidemic d with algae and untouched by any current.","c":"stagnant","s":1,"src":"own","f":"Literature"},{"e":"Researchers linked poor concentration among students to stagnant air trapped inside crowded classrooms that lacked any proper ventilation system.","c":"stagnant","s":1,"src":"own","f":"Social science"},{"e":"Local officials admit that negotiations over the housing project have grown stagnant, with no new proposals introduced in months.","c":"stagnant","s":0,"src":"own","f":"Current affairs"},{"e":"There started up, from the gate, or from the rushes, or from the ooze (which was quite in his stagnant way), Old Orlick.","c":"stagnant","s":null,"src":"classic","a":"Charles Dickens, Great Expectations (1861)"},{"e":"Distinct upon the stagnant air came the sounds of a trotting horse passing up Longpuddle Lane--just beyond the gipsies' encampment in Weatherbury Bottom.","c":"stagnant","s":null,"src":"classic","a":"Thomas Hardy, Far from the Madding Crowd (1874)"}]},{"w":"proverbial","r":249,"s":[{"p":"adj","d":"well known, as if from a proverb"},{"p":"adj","d":"expressed in a proverb"}],"x":[{"e":"The pharaoh's proverbial generosity toward temple priests was recounted for generations, long after the actual gifts and ceremonies had faded from memory.","c":"proverbial","s":0,"src":"own","f":"History"},{"e":"Among botanists, the desert cactus's proverbial resilience is often cited, since it survives droughts that would quickly wither ordinary garden plants.","c":"proverbial","s":0,"src":"own","f":"Science"},{"e":"The old sea captain's proverbial stubbornness is mentioned by nearly every character, long before he actually appears in the story.","c":"proverbial","s":0,"src":"own","f":"Literature"},{"e":"The proverbial 'firstborn overachiever' pattern is so well known that psychologists often cite it, despite mixed evidence supporting the stereotype.","c":"proverbial","s":0,"src":"own","f":"Social science"},{"e":"The city's proverbial gridlock has become so well known that visitors joke about it before ever encountering the actual traffic.","c":"proverbial","s":0,"src":"own","f":"Current affairs"},{"e":"The old adage that a chain is only as strong as its weakest link captured the proverbial wisdom guiding the empire's fragile alliances.","c":"proverbial","s":1,"src":"own","f":"History"},{"e":"Among engineers, the bridge's proverbial durability became a benchmark, referenced whenever new designs claimed to withstand extreme structural stress.","c":"proverbial","s":0,"src":"own","f":"Science"},{"e":"The play's title borrows a proverbial line about pride preceding a fall, foreshadowing the king's eventual, tragic downfall.","c":"proverbial","s":1,"src":"own","f":"Literature"},{"e":"Economists frequently quote the proverbial saying that a rising tide lifts all boats when defending broad, market-wide growth policies.","c":"proverbial","s":1,"src":"own","f":"Social science"},{"e":"The senator's proverbial reluctance to compromise is so widely recognized that reporters rarely bother explaining it anymore.","c":"proverbial","s":0,"src":"own","f":"Current affairs"},{"e":"The listener's proverbial fate was not absolutely hers; she had heard no evil of herself, but she had heard a great deal of very painful import.","c":"proverbial","s":null,"src":"classic","a":"Jane Austen, Persuasion (1817)"},{"e":"So that to this hunter's wondrous skill, the proverbial evanescence of a thing writ in water, a wake, is to all desired purposes well nigh as reliable as the steadfast land.","c":"proverbial","s":null,"src":"classic","a":"Herman Melville, Moby-Dick (1851)"}]},{"w":"pronounce","r":250,"s":[{"p":"v","d":"to say a word or sound in a particular way"},{"p":"v","d":"to declare officially or formally"}],"x":[{"e":"Colonial officials pronounced the unfamiliar Indigenous village name so incorrectly that its written spelling eventually diverged entirely from the original.","c":"pronounced","s":0,"src":"own","f":"History"},{"e":"Biology students often pronounce the ue"}],"x":[{"e":"After the coup, the general declared an indefinite curfew, and citizens had no way of knowing when normal life might resume.","c":"indefinite","s":0,"src":"own","f":"History"},{"e":"The research station's power outage left the experiment suspended for an indefinite period, since engineers could not predict when repairs would finish.","c":"indefinite","s":0,"src":"own","f":"Science"},{"e":"In the final chapter, the exiled prince is sentenced to an indefinite banishment, leaving readers uncertain whether he will ever return home.","c":"indefinite","s":0,"src":"own","f":"Literature"},{"e":"When funding collapsed, the university placed the study on indefinite hold, unable to say whether researchers would ever resume the project.","c":"indefinite","s":0,"src":"own","f":"Social science"},{"e":"The factory workers began an indefinite strike, refusing to return until management agreed to negotiate over safety concerns and pay.","c":"indefinite","s":0,"src":"own","f":"Current affairs"},{"e":"The ancient border between the two kingdoms remained indefinite for centuries, since neither side had ever marked a precise line on any map.","c":"indefinite","s":1,"src":"own","f":"History"},{"e":"Some species of tortoise can enter an indefinite state of dormancy during drought, surviving without food for uncertain lengths of time.","c":"indefinite","s":0,"src":"own","f":"Science"},{"e":"The poem ends with an indefinite image, a shadow crossing the field, leaving readers to guess whether it signals hope or dread.","c":"indefinite","s":1,"src":"own","f":"Literature"},{"e":"Survey designers avoided indefinite wording, since vague phrases like sometimes or often let respondents interpret questions in very different ways.","c":"indefinite","s":1,"src":"own","f":"Social science"},{"e":"The airline suspended the route for an indefinite time, leaving travelers unsure when flights to the island might resume.","c":"indefinite","s":0,"src":"own","f":"Current affairs"},{"e":"It makes a great difference whether the general expectation of knowledge, as this indefinite feeling may be termed, is based upon a sound judgment.","c":"indefinite","s":null,"src":"classic","a":"Plato, The Republic (tr. Benjamin Jowett) (1871)"},{"e":"It was a happy brooding, although tinged with regret at being separated for an indefinite time from her gentle aunt and dear cousin.","c":"indefinite","s":null,"src":"classic","a":"Elizabeth Gaskell, North and South (1855)"}]},{"w":"spacious","r":282,"s":[{"p":"adj","d":"having plenty of space"}],"x":[{"e":"The pharaoh's spacious throne room could accommodate hundreds of courtiers, its high ceilings and wide floor leaving room for grand processions.","c":"spacious","s":0,"src":"own","f":"History"},{"e":"Ecologists noted that the reef's spacious lagoon, with its wide expanse of open water, allowed schools of fish ample room to feed.","c":"spacious","s":0,"src":"own","f":"Science"},{"e":"The narrator describes the manor's spacious library, where tall shelves lined distant walls and sunlight filled the wide, uncluttered floor.","c":"spacious","s":0,"src":"own","f":"Literature"},{"e":"Urban planners argue that spacious public parks, with plenty of open ground for gathering, encourage stronger neighborhood ties among residents.","c":"spacious","s":0,"src":"own","f":"Social science"},{"e":"The new community center features a spacious gymnasium, with enough open floor space for multiple youth sports teams to practice at once.","c":"spacious","s":0,"src":"own","f":"Current affairs"},{"e":"Roman senators met in a spacious hall large enough to seat hundreds of representatives comfortably beneath its towering marble columns.","c":"spacious","s":0,"src":"own","f":"History"},{"e":"The cave system proved unusually spacious, its chambers wide enough for researchers to walk upright while mapping the underground network.","c":"spacious","s":0,"src":"own","f":"Science"},{"e":"In the novel, the orphan marvels at her new guardian's spacious e f":"Social science"},{"e":"Critics argue that the agency's capricious permit decisions, approving similar projects one month and rejecting them the next, discourage businesses from investing locally.","c":"capricious","s":0,"src":"own","f":"Current affairs"},{"e":"Because the regent was capricious, granting favors one week and revoking them the next, nobles never knew whether to trust his promises of protection.","c":"capricious","s":0,"src":"own","f":"History"},{"e":"Marine biologists observed that the octopus displayed capricious behavior in captivity, calmly exploring its tank one moment and violently thrashing the next without apparent cause.","c":"capricious","s":0,"src":"own","f":"Science"},{"e":"In the play, the king's capricious temper terrifies his advisers, since a single misplaced word can turn his laughter into sudden fury.","c":"capricious","s":0,"src":"own","f":"Literature"},{"e":"Sociologists note that capricious enforcement of workplace rules, strict one day and ignored the next, breeds resentment among employees who crave consistency.","c":"capricious","s":0,"src":"own","f":"Social science"},{"e":"Voters grew frustrated with the mayor's capricious stance on the transit plan, which he championed enthusiastically before abruptly abandoning it without explanation.","c":"capricious","s":0,"src":"own","f":"Current affairs"},{"e":"I had known, from the time when I could speak, that my sister, in her capricious and violent coercion, was unjust to me.","c":"capricious","s":null,"src":"classic","a":"Charles Dickens, Great Expectations (1861)"},{"e":"He said I was a capricious witch, and that he would rather sing another time; but I averred that no time was like the present.","c":"capricious","s":null,"src":"classic","a":"Charlotte Brontë, Jane Eyre (1847)"}]},{"w":"obliterate","r":284,"s":[{"p":"v","d":"to destroy completely so that nothing remains"},{"p":"v","d":"to erase or cover up completely"}],"x":[{"e":"The invading army obliterated the ancient city, l ts, purchasing new items even when closets already overflow with unused goods.","c":"insatiable","s":0,"src":"own","f":"Social science"},{"e":"Streaming platforms now feed an insatiable public appetite for content, releasing new shows faster than audiences can ever finish watching.","c":"insatiable","s":0,"src":"own","f":"Current affairs"},{"e":"Even after seizing vast silver mines, the colonial administrators remained insatiable, demanding ever more tribute from villages already stripped bare.","c":"insatiable","s":0,"src":"own","f":"History"},{"e":"The carnivorous plant's insatiable need for nitrogen drives it to trap insect after insect, since the surrounding bog soil offers almost none.","c":"insatiable","s":0,"src":"own","f":"Science"},{"e":"In the play, the wandering knight's insatiable thirst for glory pushes him toward reckless duels no victory can ever fully quiet.","c":"insatiable","s":0,"src":"own","f":"Literature"},{"e":"Psychologists note that an insatiable need for approval can leave someone chasing praise no matter how many compliments they already receive.","c":"insatiable","s":0,"src":"own","f":"Social science"},{"e":"Critics argue that tech firms have an insatiable demand for user data, always seeking more even after amassing enormous databases.","c":"insatiable","s":0,"src":"own","f":"Current affairs"},{"e":"And the insatiable desire of wealth and the neglect of all other things for the sake of money-getting was also the ruin of oligarchy?","c":"insatiable","s":null,"src":"classic","a":"Plato, The Republic (tr. Benjamin Jowett) (1871)"},{"e":"Mattie seemed to feel the contagion of his embarrassment, and sat with downcast lids, sipping her tea, while he feigned an insatiable appetite for dough-nuts and sweet pickles.","c":"insatiable","s":null,"src":"classic","a":"Edith Wharton, Ethan Frome (1911)"}]},{"w":"diversify","r":300,"s":[{"p":"v","d":"to make or become more varied"},{"p":"v","d":"to expand into new areas to reduce risk"}],"x":[{"e":"Facing crop failures, the ancient kingdom's farmers diversified their fields, planting several grains instead of relying on a single vulnerable harvest.","c":"diversified","s":0,"src":"own","f":"History"},{"e":"After the asteroid impact cleared competitors, surviving mammals rapidly diversified, evolving into countless new forms suited to vastly different habitats.","c":"diversified","s":0,"src":"own","f":"Science"},{"e":"Over her career, the novelist's themes diversified, moving from quiet domestic dramas toward sprawling stories of war and exile.","c":"diversified","s":0,"src":"own","f":"Literature"},{"e":"As newcomers settled the valley, local customs diversified, blending old harvest rituals with unfamiliar traditions brought from distant homelands.","c":"diversified","s":0,"src":"own","f":"Social science"},{"e":"Hoping to reach residents who spoke little English, the community center diversified its programs, adding classes and events in several languages.","c":"diversified","s":0,"src":"own","f":"Current affairs"},{"e":"Wary of losing everything to one collapsing trade route, the merchant guild began to diversify, opening new markets across distant, unconnected regions.","c":"diversify","s":1,"src":"own","f":"History"},{"e":"Following the volcanic eruption, the island's plant life diversified, as previously rare seeds finally found open soil and abundant sunlight.","c":"diversified","s":0,"src":"own","f":"Science"},{"e":"Sensing that romance novels alone were risky, the small press diversified into mysteries and memoirs to avoid depending on one genre.","c":"diversified","s":1,"src":"own","f":"Literature"},{"e":"Wary of relying on one employer, many workers now diversify their skills, learning trades outside their main profession for added security.","c":"diversify","s":1,"src":"own","f":"Social science"},{"e":"The city diversified its public transit options, adding bike lanes and shuttle routes alongside its long-standing, overcrowded bus system.","c":"diversified","s":0,"src":"own","f":"Current affairs"},{"e":"The outskirts of this level water-meadow were diversified by rounded and hollow pastures, where just now every flower that was not a buttercup was a daisy.","c":"diversified","s":null,"src":"classic","a":"Thomas Hardy, Far from the Madding Crowd (1874)"},{"e":"Cluster all these individuals together, as they sometimes were, with other miscellaneous ones to diversify the group, and, for the time being, it made the Custom-House a stirring scene.","c":"diversify","s":null,"src":"classic","a":"Nathaniel Hawthorne, The Scarlet Letter (1850)"}]},{"w":"insurmountable","r":301,"s":[{"p":"adj","d":"too great to be overcome"}],"x":[{"e":"Blocked by sheer cliffs and driving snow, the invading army found the mountain pass nearly insurmountable and turned back before winter.","c":"insurmountable","s":0,"src":"own","f":"History"},{"e":"Engineers considered the planet's crushing atmospheric pressure insurmountable, ruling out any lander that wasn't built from extraordinarily reinforced materials.","c":"insurmountable","s":0,"src":"own","f":"Science"},{"e":"To the grieving widow in the play, each empty morning felt insurmountable, a wall of silence she could not imagine crossing.","c":"insurmountable","s":0,"src":"own","f":"Literature"},{"e":"For many facing stigma, seeking mental health treatment can feel insurmountable, even when effective support is available nearby.","c":"insurmountable","s":0,"src":"own","f":"Social science"},{"e":"Reform advocates say the city's tangled permitting rules remain insurmountable, discouraging small businesses from ever opening their doors.","c":"insurmountable","s":0,"src":"own","f":"Current affairs"},{"e":"With treasuries empty and debts mounting, the empire's financial troubles seemed insurmountable, forcing officials to abandon several costly building projects.","c":"insurmountable","s":0,"src":"own","f":"History"},{"e":"Biologists once thought the species' genetic differences insurmountable, until new evidence showed occasional successful breeding between the two populations.","c":"insurmountable","s":0,"src":"own","f":"Science"},{"e":"The hero's final trial seemed insurmountable, a labyrinth guarded by creatures no traveler before him had ever escaped alive.","c":"insurmountable","s":0,"src":"own","f":"Literature"},{"e":"Sociologists describe the widening wealth gap as nearly insurmountable, trapping families in poverty despite generations of determined effort.","c":"insurmountable","s":0,"src":"own","f":"Social science"},{"e":"Scientists warn that without new funding, the technical hurdles facing the clean-energy project may prove insurmountable within the decade.","c":"insurmountable","s":0,"src":"own","f":"Current affairs"},{"e":"When he found the old woman he had felt an insurmountable repulsion for her at the first glance, though he knew nothing special about her.","c":"insurmountable","s":null,"src":"classic","a":"Fyodor Dostoevsky, Crime and Punishment (tr. Constance Garnett) (1866)"},{"e":"\"Yes, better quality nor any you're like to carry; you've got nothing first-rate but brazenness, I'll be bound,\" said Mrs. Glegg, with a triumphant sense of her insurmountable sagacity.","c":"insurmountable","s":null,"src":"classic","a":"George Eliot, The Mill on the Floss (1860)"}]},{"w":"methodical","r":302,"s":[{"p":"adj","d":"done in a careful, organized, step-by-step way"}],"x":[{"e":"The archaeologist worked in a methodical manner, cataloging every shard before moving even a single stone from its original resting place.","c":"methodical","s":0,"src":"own","f":"History"},{"e":"The biologist followed a methodical protocol, recording temperature and humidity at the same hour each day without exception.","c":"methodical","s":0,"src":"own","f":"Science"},{"e":"The detective in the story proceeded methodically, questioning every witness in the same careful order before drawing any conclusion.","c":"methodically","s":0,"src":"own","f":"Literature"},{"e":"The therapist used a methodical approach, moving through the same set of questions with every client to ensure consistency.","c":"methodical","s":0,"src":"own","f":"Social science"},{"e":"The auditor reviewed the city's finances methodically, checking every invoice line by line before signing off on the budget.","c":"methodically","s":0,"src":"own","f":"Current affairs"},{"e":"Rather than rushing into battle, the general was methodical, mapping supply routes and weather patterns weeks before troops ever advanced.","c":"methodical","s":0,"src":"own","f":"History"},{"e":"Before publishing results, the chemist ran methodical trials, repeating each test three times to rule out simple measurement error.","c":"methodical","s":0,"src":"own","f":"Science"},{"e":"Each morning the narrator performed a methodical ritual, sharpening pencils and arranging papers before allowing herself to write a single word.","c":"methodical","s":0,"src":"own","f":"Literature"},{"e":"Collecting survey responses, the economist worked methodically, verifying each entry before adding it to the growing dataset.","c":"methodically","s":0,"src":"own","f":"Social science"},{"e":"Inspectors examined the bridge methodically, testing each cable and joint in sequence before certifying it safe for traffic.","c":"methodically","s":0,"src":"own","f":"Current affairs"},{"e":"Having abundance of time for his usual methodical toilette, Mr. Lorry presented himself at the breakfast-hour in his usual white linen, and with his usual neat leg.","c":"methodical","s":null,"src":"classic","a":"Charles Dickens, A Tale of Two Cities (1859)"},{"e":"In his methodical brain there were distinctly formulated certain aspects of peasant life, deduced partly from that life itself, but chiefly from contrast with other modes of life.","c":"methodical","s":null,"src":"classic","a":"Leo Tolstoy, Anna Karenina (tr. Constance Garnett) (1878)"}]},{"w":"liberate","r":303,"s":[{"p":"v","d":"to set free from control or confinement"}],"x":[{"e": en liberated, through the wide entrance into the courtyard.","c":"liberated","s":null,"src":"classic","a":"Bram Stoker, Dracula (1897)"},{"e":"Cathy begged that he might be liberated then, as Isabella Linton had no partner: her entreaties were vain, and I was appointed to supply the deficiency.","c":"liberated","s":null,"src":"classic","a":"Emily Brontë, Wuthering Heights (1847)"}]},{"w":"likewise","r":304,"s":[{"p":"adv","d":"in the same way; similarly"}],"x":[{"e":"The king reformed taxation to favor merchants, and his successor likewise pursued policies that strengthened trade across the kingdom.","c":"likewise","s":0,"src":"own","f":"History"},{"e":"Plants absorb sunlight to produce energy, and certain algae likewise convert light into food through a similar chemical process.","c":"likewise","s":0,"src":"own","f":"Science"},{"e":"The hero charges bravely into battle, and his loyal companion likewise faces the danger without hesitation or complaint.","c":"likewise","s":0,"src":"own","f":"Literature"},{"e":"Firstborn children often seek their parents' approval, and younger siblings likewise crave attention, though they express it differently.","c":"likewise","s":0,"src":"own","f":"Social science"},{"e":"After one city banned single-use plastics, several nearby towns likewise adopted similar restrictions to reduce local plastic waste.","c":"likewise","s":0,"src":"own","f":"Current affairs"},{"e":"One colony rebelled against unfair tariffs, and neighboring colonies likewise revolted soon after, sparking a wider movement for independence.","c":"likewise","s":0,"src":"own","f":"History"},{"e":"Mammals regulate their body temperature internally, and some deep-sea fish likewise maintain a constant warmth despite frigid surroundings.","c":"likewise","s":0,"src":"own","f":"Science"},{"e":"The narrator distrusts every stranger who arrives at the inn, and her sister likewise remains wary of the unfamiliar guests.","c":"likewise","s":0,"src":"own","f":"Literature"},{"e":"Eco nt for the captured rebel, hoping the harsh public spectacle would deter further uprisings.","c":"exemplary","s":1,"src":"own","f":"History"},{"e":"Her exemplary experimental design, praised for its careful rigor, quickly became the template new graduate students were taught to follow.","c":"exemplary","s":0,"src":"own","f":"Science"},{"e":"The villain's ruinous downfall serves as an exemplary tale within the play, warning audiences against unchecked greed.","c":"exemplary","s":1,"src":"own","f":"Literature"},{"e":"Sociologists described the official's scandal as an exemplary case, meant to warn future leaders against accepting bribes.","c":"exemplary","s":1,"src":"own","f":"Social science"},{"e":"The city's exemplary recycling program has become a model that other municipalities hope to replicate within a few years.","c":"exemplary","s":0,"src":"own","f":"Current affairs"},{"e":"Certainly, the exemplary Mrs. Garth had her droll aspects, but her character sustained her oddities, as a very fine wine sustains a flavor of skin.","c":"exemplary","s":null,"src":"classic","a":"George Eliot, Middlemarch (1871)"},{"e":"The horror of Pitt Crawley may be imagined, as these reports of his father's dotage reached the most exemplary and correct of gentlemen.","c":"exemplary","s":null,"src":"classic","a":"William Makepeace Thackeray, Vanity Fair (1848)"}]},{"w":"flagrant","r":306,"s":[{"p":"adj","d":"obviously and shockingly wrong"}],"x":[{"e":"The treaty's flagrant violation shocked diplomats who had trusted the empire's repeated promises of lasting peace between nations.","c":"flagrant","s":0,"src":"own","f":"History"},{"e":"Peer reviewers discovered flagrant errors in the data collection, obvious mistakes that undermined the entire experiment's credibility.","c":"flagrant","s":0,"src":"own","f":"Science"},{"e":"The courtroom scene exposes the judge's flagrant bias, a favoritism so obvious that even minor characters notice it.","c":"flagrant","s":0,"src":"own","f":"Literature"} ce no strategic pressure could ever justify.","c":"inexcusable","s":0,"src":"own","f":"History"},{"e":"Publishing fabricated data was inexcusable, the review board concluded, because falsifying results betrays the basic trust underlying every scientific claim.","c":"inexcusable","s":0,"src":"own","f":"Science"},{"e":"The narrator calls her own silence inexcusable, admitting that a single honest word might have spared her sister years of quiet suffering.","c":"inexcusable","s":0,"src":"own","f":"Literature"},{"e":"Researchers argued that dismissing a colleague's idea purely because of her accent was inexcusable, revealing bias rather than any real flaw in her reasoning.","c":"inexcusable","s":0,"src":"own","f":"Social science"},{"e":"Critics called the company's delay in recalling the faulty batteries inexcusable, noting that engineers had flagged the fire risk months earlier.","c":"inexcusable","s":0,"src":"own","f":"Current affairs"},{"e":"The council's failure to warn villagers before the dam collapse was deemed inexcusable, since ample time and clear evidence of danger had existed.","c":"inexcusable","s":0,"src":"own","f":"History"},{"e":"Ignoring the obvious contamination in the water samples was inexcusable, especially when a simple retest could have prevented the flawed conclusions.","c":"inexcusable","s":0,"src":"own","f":"Science"},{"e":"Betraying his closest friend for a modest reward struck the other characters as inexcusable, no matter how desperately poor the traitor claimed to be.","c":"inexcusable","s":0,"src":"own","f":"Literature"},{"e":"Sociologists described the landlord's refusal to fix the broken heater through winter as inexcusable, given the clear danger it posed to elderly tenants.","c":"inexcusable","s":0,"src":"own","f":"Social science"},{"e":"Letting the historic library burn without even attempting to call for help was inexcusable, residents said, given how close the fire station stood.","c":"inexcusable","s":0,"src":"own","f":"Current aff e legislatures, it cannot prosecute the attempt, because the periodical change of members would otherwise regenerate the whole body.","c":"periodical","s":null,"src":"classic","a":"Hamilton, Madison, Jay, The Federalist Papers (1788)"}]},{"w":"persecute","r":320,"s":[{"p":"v","d":"to treat people cruelly and unfairly, especially because of their beliefs or identity"}],"x":[{"e":"Roman authorities persecuted early Christians for refusing to worship the emperor, imprisoning or executing those who would not renounce their faith.","c":"persecuted","s":0,"src":"own","f":"History"},{"e":"Galileo was persecuted by church officials who imprisoned him for asserting that the earth orbited the sun instead of standing still.","c":"persecuted","s":0,"src":"own","f":"Science"},{"e":"In the play, the outsider is relentlessly persecuted by villagers who blame every misfortune, from failed crops to illness, on his mere presence.","c":"persecuted","s":0,"src":"own","f":"Literature"},{"e":"Researchers studying minority communities found that groups perceived as different are often persecuted through subtle exclusion rather than overt violence.","c":"persecuted","s":0,"src":"own","f":"Social science"},{"e":"Human rights organizations report that journalists in several countries continue to be persecuted, jailed simply for publishing critical stories about officials.","c":"persecuted","s":0,"src":"own","f":"Current affairs"},{"e":"During the witch trials, accused women were persecuted on flimsy evidence, dragged from their homes and condemned without any real chance to defend themselves.","c":"persecuted","s":0,"src":"own","f":"History"},{"e":"Field biologists reported that a rare bat species is persecuted by local villagers who mistakenly believe the harmless animals spread disease.","c":"persecuted","s":0,"src":"own","f":"Science"},{"e":"The novel's narrator recalls being persecuted at boarding school, mocked and isolated simply for speaking with an unfamiliar accent.","c":"persecuted ghlighting unique features to help consumers tell brands apart.","c":"differentiation","s":0,"src":"own","f":"Current affairs"},{"e":"Ancient legal codes established a clear differentiation between free citizens and enslaved people, assigning each group separate rights and obligations.","c":"differentiation","s":0,"src":"own","f":"History"},{"e":"The differentiation of stem cells into heart, skin, or nerve cells allows a single fertilized egg to develop into a body with many specialized tissues.","c":"differentiation","s":0,"src":"own","f":"Science"},{"e":"Through careful differentiation of dialect, the author let readers instantly tell apart characters from the city and those from the countryside.","c":"differentiation","s":0,"src":"own","f":"Literature"},{"e":"Linguists rely on differentiation between dialects, using small shifts in pronunciation to classify speakers into distinct regional communities.","c":"differentiation","s":0,"src":"own","f":"Social science"},{"e":"Urban planners argue for greater differentiation between commercial and residential zones, so that each area serves clearly distinct community needs.","c":"differentiation","s":0,"src":"own","f":"Current affairs"},{"e":"All progress, as we are aware, depends on the joint process of integration and differentiation; synthesis, analysis, and then a larger synthesis seem to form the law of development.","c":"differentiation","s":null,"src":"classic","a":"John Stuart Mill, On Liberty (1859)"}]},{"w":"assimilate","r":325,"s":[{"p":"v","d":"to take in and fully understand information"},{"p":"v","d":"to become part of a new culture or group"}],"x":[{"e":"Renaissance scholars struggled to assimilate the flood of ancient texts, sorting and understanding manuscripts recovered from monasteries across Europe.","c":"assimilate","s":0,"src":"own","f":"History"},{"e":"Students in the lecture tried to assimilate the dense material on thermodynamics, rereading notes until the underlying formulas finally made sense." dling volatile chemicals, checking gauges constantly to catch any sign of overheating before it becomes dangerous.","c":"vigilant","s":0,"src":"own","f":"Science"},{"e":"Throughout the play, the nurse stays vigilant beside the sleeping child, ready to intervene at the faintest cry.","c":"vigilant","s":0,"src":"own","f":"Literature"},{"e":"Parents who feel anxious about their children's safety tend to become excessively vigilant, checking on them far more than necessary.","c":"vigilant","s":0,"src":"own","f":"Social science"},{"e":"City officials remain vigilant during flood season, monitoring river levels closely to warn residents before water breaches the banks.","c":"vigilant","s":0,"src":"own","f":"Current affairs"},{"e":"Though, to do him justice, he lay awake many an hour, silent and without stirring, unwilling to awaken his kind and vigilant nurse.","c":"vigilant","s":null,"src":"classic","a":"William Makepeace Thackeray, Vanity Fair (1848)"},{"e":"Mr. Bucket came out again, exhorting the others to be vigilant, darkened his lantern, and once more took his seat.","c":"vigilant","s":null,"src":"classic","a":"Charles Dickens, Bleak House (1853)"}]},{"w":"boisterous","r":328,"s":[{"p":"adj","d":"noisy, lively, and energetic"}],"x":[{"e":"The victory feast grew boisterous as soldiers sang, shouted toasts, and pounded the tables long into the night.","c":"boisterous","s":0,"src":"own","f":"History"},{"e":"The boisterous colony of seabirds squawked and jostled for space on the cliff, making the rookery nearly impossible to study quietly.","c":"boisterous","s":0,"src":"own","f":"Science"},{"e":"The tavern scene in the novel is boisterous, full of laughter, clinking mugs, and arguments over spilled ale.","c":"boisterous","s":0,"src":"own","f":"Literature"},{"e":"Researchers found that boisterous classrooms, though sometimes distracting, can indicate high levels of student engagement and enthusiasm.","c":"boisterous","s":0,"src":"own","f":"Social science"},{"e":"The stadium turned boisterous the moment the home team scored, with fans chanting and drums pounding through the stands.","c":"boisterous","s":0,"src":"own","f":"Current affairs"},{"e":"Colonial town meetings could turn boisterous, with farmers shouting over one another until the moderator restored order.","c":"boisterous","s":0,"src":"own","f":"History"},{"e":"Researchers noted that the primates became boisterous at feeding time, hooting and chasing each other around the enclosure.","c":"boisterous","s":0,"src":"own","f":"Science"},{"e":"The narrator recalls her boisterous cousins filling the farmhouse with shouting games that rattled the windowpanes each summer.","c":"boisterous","s":0,"src":"own","f":"Literature"},{"e":"Economists studying trading floors describe them as boisterous environments where shouted bids and frantic gestures once determined prices.","c":"boisterous","s":0,"src":"own","f":"Social science"},{"e":"City council meetings on the new development grew boisterous, as residents shouted competing opinions over one another.","c":"boisterous","s":0,"src":"own","f":"Current affairs"},{"e":"This, and the aspect of the whole scene, afforded a remarkable, and not very pleasing contrast, with our joyful and boisterous welcome at Tahiti.","c":"boisterous","s":null,"src":"classic","a":"Charles Darwin, The Voyage of the Beagle (1839)"},{"e":"Even the boisterous winds unanimously came forth from their mystic homes, and blustered about as if to enhance by their aid the wildness of the scene.","c":"boisterous","s":null,"src":"classic","a":"Mark Twain, The Adventures of Tom Sawyer (1876)"}]},{"w":"predominant","r":329,"s":[{"p":"adj","d":"most common or most important"}],"x":[{"e":"Agriculture was the predominant occupation in most ancient river valley civilizations, shaping laws, calendars, and religious festivals around harvest cycles.","c":"predominant","s":0,"src":"own","f":"History"},{"e":"Nitrogen is the predominant gas in Earth's atmosphere, far outweighing oxyg
