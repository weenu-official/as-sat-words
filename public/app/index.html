<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>A's SAT Words</title>
<meta name="description" content="350 Digital SAT words in 15 minutes a day. Built by a mom for her daughter.">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#17212D">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--ink:#17212D;--muted:#5E6A78;--rule:#DADFE5;
  --mark:#F3D34B;--accent:#1D3C8F;--accent-ink:#FFFFFF;--ok:#1F7A57;--ok-bg:#E3F2EA;--bad:#B5362F;--bad-bg:#F8E4E2;
  --l0:#E4E7EC;--l1:#C8D3EC;--l2:#8EA4DA;--l3:#4F6DBF;--l4:#1D3C8F;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C;--surface:#18202A;--ink:#E7EBF0;--muted:#97A3B1;--rule:#2B3542;
  --mark:rgba(243,211,75,.38);--accent:#8EA8F2;--accent-ink:#10151C;--ok:#5CC498;--ok-bg:#16322A;--bad:#F08A82;--bad-bg:#3A1D1C;
  --l0:#222C38;--l1:#2C3D63;--l2:#3E5896;--l3:#5F7ECF;--l4:#8EA8F2;}}
:root[data-theme="dark"]{
  --bg:#10151C;--surface:#18202A;--ink:#E7EBF0;--muted:#97A3B1;--rule:#2B3542;
  --mark:rgba(243,211,75,.38);--accent:#8EA8F2;--accent-ink:#10151C;--ok:#5CC498;--ok-bg:#16322A;--bad:#F08A82;--bad-bg:#3A1D1C;
  --l0:#222C38;--l1:#2C3D63;--l2:#3E5896;--l3:#5F7ECF;--l4:#8EA8F2;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.bar{max-width:640px;margin:0 auto;padding:14px 20px 0;display:flex;flex-direction:column;gap:10px}
.brand{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:400}
.brandrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.about{font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;padding:11px 0 11px 14px;margin:-6px 0}
.about:hover{color:var(--ink);text-decoration:underline}
nav{display:flex;gap:22px}
nav button{background:none;border:0;padding:6px 0 10px;font:600 15px var(--sans);color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
button{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:14px 20px;font-weight:700;font-size:16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);min-height:48px}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn:disabled{opacity:.45;cursor:default}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.2;margin:28px 0 6px;letter-spacing:-.015em}
h2{font-size:15px;font-weight:700;margin:32px 0 12px}
.muted{color:var(--muted)}
.small{font-size:14px}
.figs{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:20px 0}
.figs.four{grid-template-columns:repeat(4,1fr)}
.fig{padding:16px 0}
.fig+.fig{padding-left:16px;border-left:1px solid var(--rule)}
.fig b{display:block;font-family:var(--serif);font-size:40px;font-weight:600;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.figs.four .fig b{font-size:28px}
.fig span{font-size:13px;color:var(--muted)}
@media (max-width:420px){.figs.four{grid-template-columns:1fr 1fr}.figs.four .fig:nth-child(3){padding-left:0;border-left:0;border-top:1px solid var(--rule)}.figs.four .fig:nth-child(4){border-top:1px solid var(--rule)}}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--l0)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:10px;font-size:13px;color:var(--muted)}
.legend em{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;font-style:normal}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);padding:10px 16px;font-weight:600;cursor:pointer;min-width:52px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
/* study card */
.progress{height:3px;background:var(--rule);margin:18px 0 0;border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:24px 22px;margin-top:18px}
.kind{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between}
.head{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.02em;margin:0;word-break:break-word}
.hl{background-image:linear-gradient(var(--mark),var(--mark));background-repeat:no-repeat;background-position:0 88%;background-size:100% 38%;padding:0 2px}
.hl.go{animation:swipe .5s ease-out both}
@keyframes swipe{from{background-size:0 38%}to{background-size:100% 38%}}
@media (prefers-reduced-motion:reduce){.hl.go{animation:none}.progress i{transition:none}}
.pos{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:17px;margin-left:6px}
.def{font-family:var(--serif);font-size:21px;line-height:1.4;margin:14px 0 0}
.ex{font-family:var(--serif);font-size:18px;line-height:1.55;color:var(--ink);margin:12px 0 0;padding-left:14px;border-left:3px solid var(--rule)}
.ex b{font-weight:700}
.sense+.sense{margin-top:18px;padding-top:18px;border-top:1px solid var(--rule)}
.prompt{font-family:var(--serif);font-size:21px;line-height:1.5;margin:0}
.prompt.sat{font-size:18px;line-height:1.6}
.gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);height:1.1em;vertical-align:-2px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:10px;padding:13px 14px;font-size:16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;min-height:48px;line-height:1.4}
.opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1px solid var(--rule);font-size:12px;font-weight:700;display:grid;place-items:center;color:var(--muted);margin-top:1px}
.opt.w{font-family:var(--serif);font-size:19px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.spell{display:flex;gap:10px;margin-top:20px}
.spell input{flex:1;min-width:0;font:600 19px var(--serif);padding:12px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.verdict{margin-top:18px;padding:16px;border-radius:10px;font-weight:600}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.no{background:var(--bad-bg);color:var(--bad)}
.verdict .d{font-weight:400;color:var(--ink);margin-top:10px}
.speak{background:none;border:1px solid var(--rule);color:var(--ink);border-radius:999px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto}
.speak svg{width:18px;height:18px}
.actions{margin-top:20px;display:flex;gap:10px}
.hint{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
/* primary buttons stay in view at the bottom of the screen while the card scrolls */
.actions.stick{position:sticky;bottom:0;z-index:2;margin:14px -22px -24px;padding:12px 22px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--rule);border-radius:0 0 14px 14px}
.fbhint{display:none}
.qa,.qa #fb{display:contents}   /* one column: Next sticks to the screen bottom across the whole card */
@media (hover:none){.hint.keys{display:none}}
/* wide screens (tablet in landscape, laptop): question on the left, feedback and Next on the right */
@media (min-width:960px){
  body.sess .wrap,body.sess .bar{max-width:1040px}
  body.sess .qa #fb{display:block}
  body.sess .qa{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}
  body.sess .qa #fb .verdict{margin-top:0}
  body.sess .qa .fbhint{display:block;margin:0;padding:16px;border:1px dashed var(--rule);border-radius:10px;color:var(--muted);font-size:14px}
  body.sess .qa .actions.stick{margin:14px 0 0;padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));border-top:0;border-radius:0}
  body.sess .qbody .opts{margin-top:14px;gap:8px}
  body.sess .qbody .opt{padding:10px 14px;min-height:44px}
  body.sess .card{margin-top:14px;padding:20px 22px}
  body.sess .qa .actions.stick{margin-bottom:-4px}
}
/* words list */
.search{width:100%;font:500 16px var(--sans);padding:13px 14px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);margin-top:20px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 6px}
.chip{border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--rule)}
.list button.item{width:100%;background:none;border:0;color:var(--ink);text-align:left;padding:14px 0;display:flex;align-items:baseline;gap:10px;cursor:pointer}
.list .wd{font-family:var(--serif);font-size:19px;font-weight:600}
.list .st{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;align-self:center;background:var(--l0)}
.dot.learning{background:var(--l2)}.dot.mastered{background:var(--l4)}
.detail{padding:0 0 18px 18px}
.detail .def{font-size:18px;margin-top:0}
.detail .ex{font-size:16px}
/* activity */
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--l0);display:block}
.trouble li{padding:12px 0;display:flex;gap:12px;align-items:baseline}
.trouble .n{margin-left:auto;font-size:13px;color:var(--bad);font-weight:700;white-space:nowrap}
.note{font-size:13px;color:var(--muted);margin-top:28px;border-top:1px solid var(--rule);padding-top:14px}
.center{text-align:center}
/* journey */
.journey{margin-top:22px;padding:22px 0 18px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.jtop{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.jtop b{display:block;font-family:var(--serif);font-weight:700;line-height:1;letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
.jtop .pct b{font-size:56px}
.jtop .dd{text-align:right}.jtop .dd b{font-size:34px}
.jtop span{font-size:13px;color:var(--muted)}
.track{position:relative;height:14px;border-radius:7px;background:var(--l0);margin:30px 0 30px}
.track .seen,.track .mast{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.track .seen{background:var(--l2)}.track .mast{background:var(--l4)}
.track .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--surface);transform:translateX(-1px)}
.track .tl{position:absolute;top:22px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.track .tl.on{color:var(--ink);font-weight:700}
.track .tl.end{transform:translateX(-100%)}
.track .you{position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--mark);border:3px solid var(--ink);transform:translate(-50%,-50%);transition:left .6s ease-out}
.rank{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rk{font-family:var(--serif);font-weight:700;font-size:18px}
.rkbar{flex:1;min-width:90px;height:6px;border-radius:3px;background:var(--l0);overflow:hidden}.rkbar i{display:block;height:100%;background:var(--ink)}
.goalbox{margin-top:26px}
.gbar{height:10px;border-radius:5px;background:var(--l0);overflow:hidden;margin:10px 0 8px}.gbar i{display:block;height:100%;background:var(--ok);transition:width .4s}
.done-tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ok)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.week div{text-align:center;font-size:12px;color:var(--muted)}
.week i{display:block;aspect-ratio:1;max-height:40px;border-radius:8px;background:var(--l0);margin-bottom:4px;display:grid;place-items:center;font-style:normal;color:var(--accent-ink);font-weight:700;font-size:15px}
.week i.on{background:var(--l4)}
.week .today i{box-shadow:inset 0 0 0 2px var(--ink)}
.plan{display:grid;gap:8px;margin-top:10px}
.prow{display:grid;grid-template-columns:62px 1fr 84px;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;color:var(--ink);text-align:left;cursor:pointer;font-family:var(--sans)}
.prow .pm b{display:block;font-size:16px}.prow .pm span{font-size:12px;color:var(--muted)}
.prow .pb{height:10px;border-radius:5px;background:var(--l0);overflow:hidden}.prow .pb i{display:block;height:100%;background:var(--l2)}
.prow .pd{text-align:right;font-size:13px;line-height:1.3}.prow .pd b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.prow[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.prow[aria-pressed="true"] .pb i{background:var(--l4)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 10px}
.badge{text-align:center;font-size:12px;color:var(--muted);line-height:1.35}
.badge i{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:700 15px var(--serif);font-style:normal;border:2px dashed var(--rule);color:var(--muted)}
.badge.on i{background:var(--ink);color:var(--mark);border:2px solid var(--ink)}
.badge b{display:block;color:var(--ink);font-size:13px}
.badge.new i{animation:pop .6s ease-out both}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.badge.new i{animation:none}.track .you{transition:none}}
.more{margin-top:6px}
.more .ex{animation:fade .35s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.more .ex{animation:none}}
.morebtn{background:none;border:0;color:var(--accent);font:700 14px var(--sans);padding:12px 0 2px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.morebtn:disabled{color:var(--muted);cursor:default}
.more .msg{font-size:13px;color:var(--muted)}
.more .msg:empty{display:none}
body.nosample .morebtn{display:none}
.src{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:4px}
.trackseg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.trackseg button{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.trackseg button b{display:block;font-size:16px}.trackseg button span{font-size:12px;color:var(--muted)}
.trackseg button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:12px}
.unit{aspect-ratio:1;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--sans);padding:0}
.unit b{font-size:15px;color:var(--ink)}.unit .stars{font-size:10px;line-height:1;color:var(--ink)}
.unit.part{border-color:var(--l2)}
.unit.cur{border:2px solid var(--ink);background:var(--mark)}
.unit.cur b{color:#17212D}.unit.cur .stars{color:#17212D}
.unit.done{background:var(--l4);border-color:var(--l4)}.unit.done b,.unit.done .stars{color:var(--accent-ink)}
.stars span{opacity:.3}
.stars.big{font-size:34px;margin:4px 0 8px;letter-spacing:4px;color:var(--ink)}
.sheet{margin-top:14px;padding:18px;border:1px solid var(--ink);border-radius:14px;background:var(--surface)}
.uwords{display:flex;flex-wrap:wrap;gap:6px}
.uw{font-family:var(--serif);font-weight:600;font-size:15px;padding:4px 10px;border-radius:999px;border:1px solid var(--rule)}
.uw.learning{border-color:var(--l2)}.uw.mastered{background:var(--l4);border-color:var(--l4);color:var(--accent-ink)}
.lic{margin-top:28px;font-size:12px;color:var(--muted)}.lic summary{cursor:pointer;font-weight:600;font-size:13px}
.pstatus{margin-top:18px;padding:14px 16px;border:1px solid var(--rule);border-left:4px solid var(--l0);border-radius:10px;background:var(--surface)}
.pstatus.on{border-left-color:var(--ok)}.pstatus b{display:block;font-size:16px}.pstatus span{font-size:14px;color:var(--muted)}
.units.ro .unit{pointer-events:none;cursor:default}
.unit.lock{background:var(--bg);border-style:dashed;color:var(--muted)}.unit.lock b{color:var(--muted)}
.paywall{margin-top:18px;padding:18px;border:1px solid var(--ink);border-radius:14px;background:var(--surface)}
.paywall b{font-family:var(--serif);font-size:20px}.paywall p{margin:6px 0 0;color:var(--muted)}
.trial{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--rule);font-size:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.promise{margin-top:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--rule)}
.acct{margin-top:22px}
</style>
<script src="/config.js"></script>
<script src="/app/satq.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<header>
  <div class="bar">
    <div class="brandrow"><div class="brand">A's SAT Words <span>350</span></div><a class="about" href="/">About</a></div>
    <nav aria-label="Sections">
      <button data-tab="today" aria-current="page">Today</button>
      <button data-tab="words">Words</button>
      <button data-tab="progress">Progress</button>
      <button data-tab="parent">Parent</button>
    </nav>
  </div>
</header>

<script>

ic","a":"William Makepeace Thackeray, Vanity Fair (1848)"},{"e":"Here, unquestionably, ought to be seen in full display the aristocratic usurpations and tyranny which are at some future period to be exemplified in the United States.","c":"exemplified","s":null,"src":"classic","a":"Hamilton, Madison, Jay, The Federalist Papers (1788)"}]},{"w":"inference","r":32,"s":[{"p":"n","d":"a conclusion reached by reasoning from evidence rather than from direct statement"}],"x":[{"e":"Scholars studying charred grain deposits reached the inference that the ancient settlement had suffered a sudden and devastating fire.","c":"inference","s":0,"src":"own","f":"History"},{"e":"Observing the shifted rock strata, the geologist drew an inference about the ancient earthquake that must have fractured the region.","c":"inference","s":0,"src":"own","f":"Science"},{"e":"From the character's clenched fists and silence, readers can draw the inference that she is suppressing overwhelming anger.","c":"inference","s":0,"src":"own","f":"Literature"},{"e":"Economists made the inference that consumer confidence was falling based on a steady decline in discretionary spending patterns.","c":"inference","s":0,"src":"own","f":"Social science"},{"e":"Analysts drew the inference that the startup was struggling after noticing its office lights dark for weeks.","c":"inference","s":0,"src":"own","f":"Current affairs"},{"e":"Because no written records survive, historians rely on inference from pottery shards to reconstruct the trade routes of that vanished civilization.","c":"inference","s":0,"src":"own","f":"History"},{"e":"The biologist's inference that the fish had migrated came solely from unusual scale patterns rather than any direct tracking data.","c":"inference","s":0,"src":"own","f":"Science"},{"e":"The detective in the story bases every inference on subtle clues, never once relying on a witness's direct confession.","c":"inference","s":0,"src":"own","f":"Literature"},{"e":"The psychologist's infere ks in advance.","c":"spontaneous","s":1,"src":"own","f":"Social science"},{"e":"The clinic reported cases of spontaneous recovery among patients, improvement that occurred without any of the newly tested treatments.","c":"spontaneous","s":0,"src":"own","f":"Current affairs"},{"e":"If this new phase was spontaneous, or in any way due to her unconscious influence, she must have some rare gift or power.","c":"spontaneous","s":null,"src":"classic","a":"Bram Stoker, Dracula (1897)"},{"e":"All he said was so free from effort and spontaneous and was said with such a captivating gaiety that it was fascinating to hear him talk.","c":"spontaneous","s":null,"src":"classic","a":"Charles Dickens, Bleak House (1853)"}]},{"w":"divergence","r":63,"s":[{"p":"n","d":"a difference or separation that develops between things"}],"x":[{"e":"After the trade routes split, the two kingdoms developed such a divergence in customs and language that traders eventually needed interpreters to communicate.","c":"divergence","s":0,"src":"own","f":"History"},{"e":"Biologists studying the isolated island finches traced a genetic divergence so pronounced that the once-similar birds could no longer interbreed successfully.","c":"divergence","s":0,"src":"own","f":"Science"},{"e":"The novel's two narrators recount the same summer so differently that the divergence between their versions leaves readers unsure whom to trust.","c":"divergence","s":0,"src":"own","f":"Literature"},{"e":"Economists noted a growing divergence between wages and living costs, a gap that left many families unable to save for emergencies.","c":"divergence","s":0,"src":"own","f":"Social science"},{"e":"City planners are grappling with a divergence between residents' desire for green space and developers' push to maximize housing density.","c":"divergence","s":0,"src":"own","f":"Current affairs"},{"e":"Historians point to a sudden divergence in policy between the young king and his father's advisers, which led quickly to open rebellion.","c":"divergence","s":0,"src":"own","f":"History"},{"e":"The satellite data revealed a slow divergence between predicted and actual ocean temperatures, forcing climate modelers to revise their underlying assumptions.","c":"divergence","s":0,"src":"own","f":"Science"},{"e":"As the play progresses, a widening divergence emerges between the hero's noble speeches and his increasingly selfish, cowardly private actions.","c":"divergence","s":0,"src":"own","f":"Literature"},{"e":"The study revealed a divergence between what survey respondents claimed to value and how they actually spent their limited free time.","c":"divergence","s":0,"src":"own","f":"Social science"},{"e":"Engineers noticed a troubling divergence between the app's projected battery life and the shorter runtime users actually reported after updates.","c":"divergence","s":0,"src":"own","f":"Current affairs"},{"e":"I hear Mrs. Trenor wants to build out a new ball-room, and that divergence from Gus on that point keeps her at Bellomont.","c":"divergence","s":null,"src":"classic","a":"Edith Wharton, The House of Mirth (1905)"},{"e":"But on seeing Bathsheba turn, he looked aside, and as soon as he got beyond the gate, and there was the barest excuse for a divergence, he made one, and vanished.","c":"divergence","s":null,"src":"classic","a":"Thomas Hardy, Far from the Madding Crowd (1874)"}]},{"w":"deviation","r":64,"s":[{"p":"n","d":"a departure from what is normal, expected, or planned"}],"x":[{"e":"The general's sudden deviation from the agreed battle plan surprised his own officers, yet it ultimately caught the enemy completely off guard.","c":"deviation","s":0,"src":"own","f":"History"},{"e":"Researchers flagged the reading as a deviation from the instrument's normal output, suspecting a faulty sensor rather than a true signal.","c":"deviation","s":0,"src":"own","f":"Science"},{"e":"The narrator's calm, orderly voice breaks with one strange deviation into fragmented sentences, hinting that something benea lended culture.","c":"converge","s":1,"src":"own","f":"Social science"},{"e":"Diplomats from dozens of nations converged on the coastal city this week, filling hotels that are usually reserved for summer tourists.","c":"converged","s":0,"src":"own","f":"Current affairs"},{"e":"These gradually converged upon the base of the hill, and the flocks became individually visible, climbing the serpentine ways which led to the top.","c":"converged","s":null,"src":"classic","a":"Thomas Hardy, Far from the Madding Crowd (1874)"},{"e":"Everybody looked up at the open windows in the houses at the opposite angles of the converging streets; but they were either blank, or filled by laughing listeners.","c":"converging","s":null,"src":"classic","a":"George Eliot, Middlemarch (1871)"}]},{"w":"conceptualize","r":104,"s":[{"p":"v","d":"to form an idea or concept of something in the mind"}],"x":[{"e":"Long before written contracts existed, early merchants had to conceptualize fairness itself, inventing shared standards for weighing goods that strangers could trust.","c":"conceptualize","s":0,"src":"own","f":"History"},{"e":"To design the experiment, the biologist first had to conceptualize an invisible force acting between cells, something no instrument of the era could directly show.","c":"conceptualize","s":0,"src":"own","f":"Science"},{"e":"The young poet struggled to conceptualize grief as anything other than a heavy stone, unable to picture it as something that might eventually lighten.","c":"conceptualize","s":0,"src":"own","f":"Literature"},{"e":"Economists often conceptualize trust as an invisible currency, something spent and earned in every transaction even though it never appears on a balance sheet.","c":"conceptualize","s":0,"src":"own","f":"Social science"},{"e":"City planners are trying to conceptualize a neighborhood without cars entirely, imagining streets given over to gardens, bicycles, and wide pedestrian walkways instead.","c":"conceptualize","s":0,"src":"own","f":"Cu cted selfish behavior from someone raised amid such scarcity and hardship.","c":"confounded","s":0,"src":"own","f":"Social science"},{"e":"The abrupt drop in emissions confounded energy analysts, who had expected demand to keep climbing steadily alongside the region's rapid population growth.","c":"confounded","s":0,"src":"own","f":"Current affairs"},{"e":"Early chroniclers often confounded two rulers who shared the same name, blending their separate reigns into a single, mistakenly continuous story.","c":"confounded","s":1,"src":"own","f":"History"},{"e":"The creature's ability to survive without oxygen confounded marine biologists, who had assumed no complex animal could endure such an inhospitable environment.","c":"confounded","s":0,"src":"own","f":"Science"},{"e":"Throughout the play, the twins' identical appearance confounds every other character, who mistake one sibling's kindness for the other's well-known cruelty.","c":"confounds","s":1,"src":"own","f":"Literature"},{"e":"The poorly designed experiment confounded stress with sleep deprivation, leaving sociologists unable to determine which factor actually drove participants' declining performance.","c":"confounded","s":1,"src":"own","f":"Social science"},{"e":"The candidate's unpredictable strategy confounded political commentators, who kept revising their predictions after each debate upended their earlier assumptions.","c":"confounded","s":0,"src":"own","f":"Current affairs"},{"e":"I derived from this speech that Mr. Herbert Pocket (for Herbert was the pale young gentleman's name) still rather confounded his intention with his execution.","c":"confounded","s":null,"src":"classic","a":"Charles Dickens, Great Expectations (1861)"},{"e":"Mr. Bounderby quite confounded, stood stock-still in the street after his father-in-law had left him, swelling like an immense soap-bubble, without its beauty.","c":"confounded","s":null,"src":"classic","a":"Charles Dickens, Hard Times (1854)"}]},{"w":"ponder","r":106,"s":[{ rs.","c":"pondered","s":0,"src":"own","f":"Current affairs"},{"e":"He sat on his bed in the darkness, crouched up, hugging his knees, and holding his breath from the strain of thought, he pondered.","c":"pondered","s":null,"src":"classic","a":"Leo Tolstoy, Anna Karenina (tr. Constance Garnett) (1878)"},{"e":"But his eyes were fixed on the floor, where he was moving the end of his stick, as if he were pondering on something absently.","c":"pondering","s":null,"src":"classic","a":"George Eliot, Silas Marner (1861)"}]},{"w":"denote","r":107,"s":[{"p":"v","d":"to be a sign of; to indicate"},{"p":"v","d":"to mean or name something"}],"x":[{"e":"Among the tribal elders, a raised staff carried into council would denote authority, signaling to all present that the bearer's words demanded silence and respect.","c":"denote","s":0,"src":"own","f":"History"},{"e":"In the coral survey, a bleached white patch on the reef structure can denote thermal stress, warning researchers that the underlying tissue is dying.","c":"denote","s":0,"src":"own","f":"Science"},{"e":"Throughout the play, the recurring image of a caged bird seems to denote the heroine's longing to escape her arranged marriage.","c":"denote","s":0,"src":"own","f":"Literature"},{"e":"Researchers noted that a lowered gaze during conversation can denote submission in some cultures, while in others it simply reflects politeness.","c":"denote","s":0,"src":"own","f":"Social science"},{"e":"A flashing red icon on the city's transit app now denotes a delayed train, letting riders adjust their plans before reaching the platform.","c":"denotes","s":0,"src":"own","f":"Current affairs"},{"e":"In medieval guild records, the title 'master' came to denote not mere skill but formal certification after years of supervised apprenticeship.","c":"denote","s":1,"src":"own","f":"History"},{"e":"On the seismograph readout, a sudden sharp spike in the jagged line can denote the onset of a tremor deep beneath the crust.","c":"denote","s":0," onses can feel instantaneous, occurring before a person consciously registers the threat that triggered them.","c":"instantaneous","s":0,"src":"own","f":"Social science"},{"e":"With the new translation app, conversations between speakers of different languages now feel nearly instantaneous, with barely a pause between question and answer.","c":"instantaneous","s":0,"src":"own","f":"Current affairs"},{"e":"Historians note that the eruption's destruction of the ancient city was nearly instantaneous, burying homes and streets before most residents could flee.","c":"instantaneous","s":0,"src":"own","f":"History"},{"e":"The neuron's response to the stimulus appeared instantaneous, firing so quickly that researchers needed specialized equipment just to measure the tiny delay.","c":"instantaneous","s":0,"src":"own","f":"Science"},{"e":"The poem captures an instantaneous shift in mood, moving from quiet contentment to sudden dread within a single unbroken line.","c":"instantaneous","s":0,"src":"own","f":"Literature"},{"e":"Economists observed an almost instantaneous drop in consumer confidence right after the bank's collapse was announced on national television.","c":"instantaneous","s":0,"src":"own","f":"Social science"},{"e":"When the power grid failed, the backup generators provided instantaneous electricity, so hospital equipment never lost function even for a single second.","c":"instantaneous","s":0,"src":"own","f":"Current affairs"},{"e":"The flash of lightning, the crash of thunder, and the instantaneous chill that ran through him were all merged for Levin in one sense of terror.","c":"instantaneous","s":null,"src":"classic","a":"Leo Tolstoy, Anna Karenina (tr. Constance Garnett) (1878)"},{"e":"When the doctor came he said that death had been instantaneous and probably painless, caused in all likelihood by some sudden shock.","c":"instantaneous","s":null,"src":"classic","a":"L. M. Montgomery, Anne of Green Gables (1908)"}]},{"w":"sympathize","r":122,"s":[{"p":"v","d ish that are swimming in the clear waters, where we can distinguish every pebble that lies at the bottom.","c":"innumerable","s":null,"src":"classic","a":"Mary Shelley, Frankenstein (1818)"},{"e":"On that theory they would have grown innumerable some Eight Hundred Thousand Years hence, and it was no great wonder to see four at once.","c":"innumerable","s":null,"src":"classic","a":"H. G. Wells, The Time Machine (1895)"}]},{"w":"incomprehensible","r":129,"s":[{"p":"adj","d":"impossible to understand"}],"x":[{"e":"To later historians, the emperor's sudden decision to abandon the capital seemed incomprehensible, since no surviving record explained his reasoning.","c":"incomprehensible","s":0,"src":"own","f":"History"},{"e":"The raw output from the particle detector was incomprehensible until researchers translated the tangled signals into a readable graph.","c":"incomprehensible","s":0,"src":"own","f":"Science"},{"e":"The old letters, faded and stained, were nearly incomprehensible, leaving the narrator to guess at whole sentences from scattered fragments.","c":"incomprehensible","s":0,"src":"own","f":"Literature"},{"e":"To newcomers, the dense bureaucratic jargon in the welfare application seemed incomprehensible, discouraging many eligible families from ever applying.","c":"incomprehensible","s":0,"src":"own","f":"Social science"},{"e":"The city's new zoning code proved incomprehensible to most residents, prompting officials to publish a simplified summary online.","c":"incomprehensible","s":0,"src":"own","f":"Current affairs"},{"e":"The ancient treaty was written in a script so incomprehensible that scholars debated its meaning for generations without reaching agreement.","c":"incomprehensible","s":0,"src":"own","f":"History"},{"e":"Without training, the dense chemical notation on the whiteboard appeared incomprehensible, a maze of symbols no outsider could decode.","c":"incomprehensible","s":0,"src":"own","f":"Science"},{"e":"By the play's final act, the protagonist rt have complained for years about incessant noise, saying the roar of departing planes never truly stops.","c":"incessant","s":0,"src":"own","f":"Current affairs"},{"e":"Chroniclers described incessant raids along the northern border, so relentless that villagers rebuilt their homes only to see them burned again.","c":"incessant","s":0,"src":"own","f":"History"},{"e":"In the rainforest canopy, incessant chirping from insects filled the night, a constant drone that never seemed to pause for silence.","c":"incessant","s":0,"src":"own","f":"Science"},{"e":"Throughout the novel, the clock's incessant ticking becomes a symbol of the protagonist's mounting dread as the deadline approaches.","c":"incessant","s":0,"src":"own","f":"Literature"},{"e":"Economists noted that incessant price fluctuations eroded consumer confidence, leaving households unable to plan even simple monthly budgets.","c":"incessant","s":0,"src":"own","f":"Social science"},{"e":"The city council received incessant complaints about the pothole-ridden avenue, with residents calling almost daily to demand immediate repairs.","c":"incessant","s":0,"src":"own","f":"Current affairs"},{"e":"He did not approve of a too lowering system, including reckless cupping, nor, on the other hand, of incessant port wine and bark.","c":"incessant","s":null,"src":"classic","a":"George Eliot, Middlemarch (1871)"},{"e":"We have had such incessant rains almost since October began, that we have been nearly confined to the house for days together.","c":"incessant","s":null,"src":"classic","a":"Jane Austen, Mansfield Park (1814)"}]},{"w":"desolate","r":131,"s":[{"p":"adj","d":"empty, bare, and lifeless"},{"p":"adj","d":"very lonely and unhappy"}],"x":[{"e":"After the siege ended, the once-thriving city lay desolate, its markets abandoned and streets choked with rubble and drifting ash.","c":"desolate","s":0,"src":"own","f":"History"},{"e":"Satellite images revealed a desolate stretch of desert where no plants, animals, or standing water could be found for miles.","c":"desolate","s":0,"src":"own","f":"Science"},{"e":"The narrator wandered a desolate moor at dusk, finding only broken fences and wind where a village once stood.","c":"desolate","s":0,"src":"own","f":"Literature"},{"e":"Sociologists studying rural depopulation note that once-vibrant towns can become desolate, their schools closed and streets stripped of residents within a generation.","c":"desolate","s":0,"src":"own","f":"Social science"},{"e":"Years of drought have left the reservoir's basin desolate, a cracked expanse where boats once floated above deep water.","c":"desolate","s":0,"src":"own","f":"Current affairs"},{"e":"Exiled to a distant fortress and stripped of his title, the deposed king grew desolate, writing letters no one ever answered.","c":"desolate","s":1,"src":"own","f":"History"},{"e":"Volcanic eruptions had left the island desolate, its slopes coated in gray ash and utterly devoid of visible life.","c":"desolate","s":0,"src":"own","f":"Science"},{"e":"Left alone in the drafty manor after her sisters married, Eleanor felt desolate, her days emptied of laughter or company.","c":"desolate","s":1,"src":"own","f":"Literature"},{"e":"Newly arrived immigrants sometimes describe the first months abroad as desolate, cut off from family and unfamiliar with local customs.","c":"desolate","s":1,"src":"own","f":"Social science"},{"e":"The mall's upper floor sits desolate now, its shuttered storefronts and dark hallways a stark contrast to its once-bustling crowds.","c":"desolate","s":0,"src":"own","f":"Current affairs"},{"e":"Some melancholy influence is upon her, or why should so proud a lady close the doors and sit alone upon the hearth so desolate?","c":"desolate","s":null,"src":"classic","a":"Charles Dickens, Bleak House (1853)"},{"e":"If, therefore, I could seize him and educate him as my companion and friend, I should not be so desolate in this peopled earth.","c":"desolate","s":null,"src":"classic","a":"Mary Shelley s alone.","c":"empirical","s":0,"src":"own","f":"History"},{"e":"Before publishing, the chemist gathered empirical evidence, repeating the experiment dozens of times to confirm the results held under varied conditions.","c":"empirical","s":0,"src":"own","f":"Science"},{"e":"The old professor in the novel trusted only empirical proof, dismissing his colleague's elegant theories until he could witness the phenomenon himself.","c":"empirical","s":0,"src":"own","f":"Literature"},{"e":"Economists prefer empirical studies that track actual spending habits over time, rather than models built solely on abstract assumptions about behavior.","c":"empirical","s":0,"src":"own","f":"Social science"},{"e":"Policymakers are demanding empirical proof that the new traffic system reduces accidents before committing further funding to its expansion citywide.","c":"empirical","s":0,"src":"own","f":"Current affairs"},{"e":"The astronomer built his theory on empirical data, carefully recording each planet's position night after night instead of relying on inherited assumptions.","c":"empirical","s":0,"src":"own","f":"History"},{"e":"The hypothesis remained unproven until researchers collected empirical measurements from the field, replacing speculation with numbers gathered directly from the ecosystem.","c":"empirical","s":0,"src":"own","f":"Science"},{"e":"Rather than accept the prophecy at face value, the skeptical heroine demanded empirical proof, testing each omen against what she could see and touch.","c":"empirical","s":0,"src":"own","f":"Literature"},{"e":"The psychologist's claim gained credibility only after empirical testing showed that the pattern appeared consistently across hundreds of observed participants.","c":"empirical","s":0,"src":"own","f":"Social science"},{"e":"Environmental groups presented empirical readings from local rivers to counter the company's assurance that pollution levels had not changed.","c":"empirical","s":0,"src":"own","f":"Current affairs"},{"e":"In ir outdated defenses.","c":"complacent","s":0,"src":"own","f":"Current affairs"},{"e":"Years of prosperity left the empire's officials complacent, so confident in their strength that they overlooked the rebellion gathering along the frontier.","c":"complacent","s":0,"src":"own","f":"History"},{"e":"Engineers warned against becoming complacent about the bridge's stability, since ignoring small cracks now could lead to catastrophic failure later.","c":"complacent","s":0,"src":"own","f":"Science"},{"e":"By the third act, the king had become complacent on his throne, deaf to the whispered plots forming among his own advisors.","c":"complacent","s":0,"src":"own","f":"Literature"},{"e":"Researchers found that voters in stable democracies sometimes grow complacent, assuming institutions will protect their rights without any ongoing civic effort.","c":"complacent","s":0,"src":"own","f":"Social science"},{"e":"Public health officials warn against becoming complacent about vaccination rates, since even a brief lapse in coverage can allow diseases to return.","c":"complacent","s":0,"src":"own","f":"Current affairs"},{"e":"He recalled his own criticisms of Tyndall of his complacent satisfaction in the cleverness of his experiments, and for his lack of philosophic insight.","c":"complacent","s":null,"src":"classic","a":"Leo Tolstoy, Anna Karenina (tr. Constance Garnett) (1878)"},{"e":"Towards Mr. Pocket, as a grown-up infant with no notion of his own interests, they showed the complacent forbearance I had heard them express.","c":"complacent","s":null,"src":"classic","a":"Charles Dickens, Great Expectations (1861)"}]},{"w":"exaggerate","r":139,"s":[{"p":"v","d":"to describe something as larger, better, or worse than it really is"}],"x":[{"e":"Court chroniclers often exaggerated the king's victories, crediting him with triumphs that muster rolls and enemy accounts never actually confirm.","c":"exaggerated","s":0,"src":"own","f":"History"},{"e":"Early naturalists sometimes exaggerated the ferocity of newly discovered predators, describing timid scavengers as bloodthirsty monsters that terrorized entire villages.","c":"exaggerated","s":0,"src":"own","f":"Science"},{"e":"The narrator, prone to self-pity, exaggerated his childhood hardships, painting a modest but loving household as a scene of constant deprivation.","c":"exaggerated","s":0,"src":"own","f":"Literature"},{"e":"Survey respondents sometimes exaggerate their own generosity, reporting donations far larger than the modest amounts their bank records actually show.","c":"exaggerate","s":0,"src":"own","f":"Social science"},{"e":"Online reviewers occasionally exaggerate a product's flaws, transforming a minor inconvenience into a supposed safety hazard that scares away buyers.","c":"exaggerate","s":0,"src":"own","f":"Current affairs"},{"e":"Ambassadors returning from the frontier tended to exaggerate the size of enemy forces, inflating modest raiding parties into full invading armies.","c":"exaggerate","s":0,"src":"own","f":"History"},{"e":"Science journalists risk exaggerating a preliminary lab result, turning a single small experiment into a sweeping cure reported as though proven.","c":"exaggerating","s":0,"src":"own","f":"Science"},{"e":"In the play, the boastful soldier exaggerates his battlefield exploits so wildly that even his loyal servant begins to roll his eyes.","c":"exaggerates","s":0,"src":"own","f":"Literature"},{"e":"Economists caution that firms may exaggerate projected profits to attract investors, presenting hopeful guesses as though they were near-certain outcomes.","c":"exaggerate","s":0,"src":"own","f":"Social science"},{"e":"City officials were accused of exaggerating crime statistics to justify a budget increase, though independent audits found far milder trends.","c":"exaggerating","s":0,"src":"own","f":"Current affairs"},{"e":"He certainly does not mean here to exaggerate the reward, and we may be assured that it was not less than he represents it.","c":"exaggera age reform, refusing to soften their demands despite pressure from employers.","c":"strenuous","s":1,"src":"own","f":"Social science"},{"e":"Negotiating the new trade agreement required strenuous effort from diplomats, who spent months resolving disputes late into the night.","c":"strenuous","s":0,"src":"own","f":"Current affairs"},{"e":"Levin, looking at the tiny, pitiful creature, made strenuous efforts to discover in his heart some traces of fatherly feeling for it.","c":"strenuous","s":null,"src":"classic","a":"Leo Tolstoy, Anna Karenina (tr. Constance Garnett) (1878)"},{"e":"And, indeed, to own the truth, I do not think nurse, in her heart, is a very strenuous opposer of Sir Walter's making a second match.","c":"strenuous","s":null,"src":"classic","a":"Jane Austen, Persuasion (1817)"}]},{"w":"humiliate","r":141,"s":[{"p":"v","d":"to make someone feel ashamed and foolish"}],"x":[{"e":"After losing the decisive battle, the general was humiliated before his own troops, stripped of rank in a public ceremony.","c":"humiliated","s":0,"src":"own","f":"History"},{"e":"The failed experiment humiliated the young researcher, whose miscalculated results were mocked openly during the department's weekly seminar.","c":"humiliated","s":0,"src":"own","f":"Science"},{"e":"The cruel siblings humiliated Cinderella nightly, forcing her to scrub floors while they mocked her tattered, soot-streaked dress.","c":"humiliated","s":0,"src":"own","f":"Literature"},{"e":"Researchers found that publicly correcting employees' mistakes tends to humiliate them, often lowering morale more than private feedback would.","c":"humiliate","s":0,"src":"own","f":"Social science"},{"e":"The leaked internal memo humiliated the company's executives, exposing careless comments that contradicted their public promises of transparency.","c":"humiliated","s":0,"src":"own","f":"Current affairs"},{"e":"The defeated monarch was humiliated at the peace talks, forced to sign terms that stripped away nearly all his l theorized, not without truth, that in quiet discussion of any matter within reach of the speakers' eyes, these are usually fixed upon it.","c":"theorized","s":null,"src":"classic","a":"Thomas Hardy, Far from the Madding Crowd (1874)"},{"e":"She was thoroughly charming to him, but of course he theorized a little about his attachment.","c":"theorized","s":null,"src":"classic","a":"George Eliot, Middlemarch (1871)"}]},{"w":"virtuous","r":158,"s":[{"p":"adj","d":"having high moral standards"}],"x":[{"e":"Ancient chroniclers praised the general as virtuous, noting he refused to plunder conquered villages even when his starving troops demanded it.","c":"virtuous","s":0,"src":"own","f":"History"},{"e":"The naturalist described the elder statesman's virtuous restraint, refusing personal gain from his discoveries even as wealthier rivals grew rich exploiting them.","c":"virtuous","s":0,"src":"own","f":"Science"},{"e":"The heroine is portrayed as virtuous throughout the novel, refusing every bribe and shielding the accused despite the danger to herself.","c":"virtuous","s":0,"src":"own","f":"Literature"},{"e":"Psychologists found that people rated as virtuous by peers tend to report greater life satisfaction, even without material rewards for their kindness.","c":"virtuous","s":0,"src":"own","f":"Social science"},{"e":"The whistleblower was hailed as virtuous for exposing the scandal, risking her career to reveal wrongdoing that others preferred to ignore.","c":"virtuous","s":0,"src":"own","f":"Current affairs"},{"e":"The reformer was remembered as virtuous for returning bribes untouched, a rare integrity that earned trust even among his political rivals.","c":"virtuous","s":0,"src":"own","f":"History"},{"e":"Colleagues considered the retired surgeon virtuous, since he still volunteered weekly at the free clinic despite needing no further reputation.","c":"virtuous","s":0,"src":"own","f":"Science"},{"e":"Unlike his scheming brother, the younger prince in the play remains virtuous, honoring his promises even when breaking them would be easy.","c":"virtuous","s":0,"src":"own","f":"Literature"},{"e":"Sociologists studying charitable giving noted that communities perceived as virtuous often attract more investment, since trust lowers the cost of cooperation.","c":"virtuous","s":0,"src":"own","f":"Social science"},{"e":"Advocates praised the company as virtuous for refusing to sell user data, even though rivals profited handsomely from doing so.","c":"virtuous","s":0,"src":"own","f":"Current affairs"},{"e":"This, however, is but an instance of that familiar fact, the power of habit, and is nowise confined to the case of virtuous actions.","c":"virtuous","s":null,"src":"classic","a":"John Stuart Mill, Utilitarianism (1863)"},{"e":"On the whole, one might say that an ardent charity was at work setting the virtuous mind to make a neighbor unhappy for her good.","c":"virtuous","s":null,"src":"classic","a":"George Eliot, Middlemarch (1871)"}]},{"w":"diligent","r":159,"s":[{"p":"adj","d":"showing steady, careful effort in work or duties"}],"x":[{"e":"The colonial clerk was so diligent in copying land records that historians later relied on his careful ledgers to reconstruct disputed property lines.","c":"diligent","s":0,"src":"own","f":"History"},{"e":"The field biologist was diligent, checking each trap twice daily so no injured animal would suffer unnoticed overnight.","c":"diligent","s":0,"src":"own","f":"Science"},{"e":"In the novel, the housekeeper is diligent to a fault, scrubbing floors long after guests have gone to bed.","c":"diligent","s":0,"src":"own","f":"Literature"},{"e":"Researchers found that diligent students, who reviewed notes nightly rather than cramming, retained material far longer than their peers.","c":"diligent","s":0,"src":"own","f":"Social science"},{"e":"City auditors were diligent, tracing every disputed invoice line by line until the missing funds were finally located.","c":"diligent","s":0,"src":"own","f":"Current der every evening until the pattern revealed itself.","c":"systematic","s":0,"src":"own","f":"Literature"},{"e":"Economists praised the agency's systematic review of loan applications, which followed identical criteria rather than shifting case by case.","c":"systematic","s":0,"src":"own","f":"Social science"},{"e":"City planners launched a systematic inspection of bridges, checking each structure on a fixed schedule rather than waiting for complaints.","c":"systematic","s":0,"src":"own","f":"Current affairs"},{"e":"Archivists praised the pharaoh's systematic method of dating decrees, which followed the same fixed sequence of symbols each year.","c":"systematic","s":0,"src":"own","f":"History"},{"e":"Ecologists conducted a systematic survey, walking evenly spaced transects through the forest instead of wandering wherever seemed interesting.","c":"systematic","s":0,"src":"own","f":"Science"},{"e":"The narrator's systematic habit of cataloging every letter by date and sender revealed, page by page, the slow unraveling of her marriage.","c":"systematic","s":0,"src":"own","f":"Literature"},{"e":"The psychologist designed a systematic interview protocol, asking every participant the same questions in the same order to avoid bias.","c":"systematic","s":0,"src":"own","f":"Social science"},{"e":"The startup adopted a systematic hiring process, scoring every candidate on identical criteria instead of trusting gut instinct.","c":"systematic","s":0,"src":"own","f":"Current affairs"},{"e":"The systematic manner in which this was done made me think that he could not mean to confine himself to two sides of London.","c":"systematic","s":null,"src":"classic","a":"Bram Stoker, Dracula (1897)"},{"e":"Every nation, consequently, whose affairs betray a want of wisdom and stability, may calculate on every loss which can be sustained from the more systematic policy of their wiser neighbors.","c":"systematic","s":null,"src":"classic","a":"Hamilton, Madison, Jay, The Federalist Papers (1788)"}]},{"w":"corollary","r":161,"s":[{"p":"n","d":"a natural consequence or result of something else"}],"x":[{"e":"Rising grain prices were a direct corollary of the drought, since fewer harvests meant merchants could charge desperate buyers more.","c":"corollary","s":0,"src":"own","f":"History"},{"e":"Warmer ocean temperatures are a corollary of rising carbon levels, since trapped heat inevitably transfers into the surrounding seawater.","c":"corollary","s":0,"src":"own","f":"Science"},{"e":"The protagonist's newfound humility emerges as a corollary of his public humiliation, for pride rarely survives such a bruising, communal spectacle.","c":"corollary","s":0,"src":"own","f":"Literature"},{"e":"Sociologists argue that isolation is a common corollary of long-distance remote work, as casual daily interactions gradually disappear.","c":"corollary","s":0,"src":"own","f":"Social science"},{"e":"Traffic congestion has become an unwelcome corollary of the city's booming population, as more cars compete for the same narrow streets.","c":"corollary","s":0,"src":"own","f":"Current affairs"},{"e":"Historians view the collapse of trade routes as a corollary of the empire's fall, since merchants no longer traveled safely.","c":"corollary","s":0,"src":"own","f":"History"},{"e":"Faster metabolic rates are often a corollary of smaller body size, since tiny animals lose heat more quickly and must compensate.","c":"corollary","s":0,"src":"own","f":"Science"},{"e":"In the play, the kingdom's famine is treated as a corollary of the tyrant's neglect, since abandoned fields inevitably yield nothing.","c":"corollary","s":0,"src":"own","f":"Literature"},{"e":"Economists note that inflation is often a corollary of rapid wage growth, since businesses raise prices to cover higher payroll costs.","c":"corollary","s":0,"src":"own","f":"Social science"},{"e":"Analysts warn that data breaches are a growing corollary of widespread cloud storage, since more information now sits in shared systems.","c":"corollary","s":0,"src":"own","f":"Current affairs"},{"e":"In one point of view, they may be considered as corollaries from the principles already laid down.","c":"corollaries","s":null,"src":"classic","a":"John Stuart Mill, Utilitarianism (1863)"},{"e":"Baxter had been open at least eight hours by this time, for it was nearly five o'clock; and if people are to quarrel often, it follows as a corollary that their quarrels cannot be protracted beyond certain limits.","c":"corollary","s":null,"src":"classic","a":"George Eliot, The Mill on the Floss (1860)"}]},{"w":"courteous","r":162,"s":[{"p":"adj","d":"polite and respectful"}],"x":[{"e":"Envoys visiting the court were expected to remain courteous even when negotiations grew tense, bowing before speaking and never raising their voices.","c":"courteous","s":0,"src":"own","f":"History"},{"e":"Even when correcting a colleague's error, the researcher remained courteous, softening every criticism with a compliment about the experiment's design.","c":"courteous","s":0,"src":"own","f":"Science"},{"e":"Though the butler despised his master, he remained outwardly courteous, bowing crisply and never letting his resentment slip into his tone.","c":"courteous","s":0,"src":"own","f":"Literature"},{"e":"Researchers studying workplace hierarchies found that employees were far more courteous to supervisors than to peers, softening requests with extra apologies and thanks.","c":"courteous","s":0,"src":"own","f":"Social science"},{"e":"The new city ordinance encourages drivers to be courteous at crosswalks, waving pedestrians through instead of inching forward impatiently.","c":"courteous","s":0,"src":"own","f":"Current affairs"},{"e":"The general was famously courteous to defeated soldiers, offering them food and shelter rather than public humiliation.","c":"courteous","s":0,"src":"own","f":"History"},{"e":"The museum guide stayed courteous with visitors who asked the same questions repeatedly, answering each one patiently and without sighing.","c":"courteous","s":0,"src":"own","f":"Science"},{"e":"The knight's courteous manner toward strangers, bowing and offering his seat, contrasted sharply with his brutal conduct on the battlefield.","c":"courteous","s":0,"src":"own","f":"Literature"},{"e":"Linguists observed that speakers switch to more courteous phrasing when addressing elders, softening requests with extra polite particles.","c":"courteous","s":0,"src":"own","f":"Social science"},{"e":"Even during heated town hall debates, the moderator asked residents to remain courteous, waiting their turn instead of shouting over one another.","c":"courteous","s":0,"src":"own","f":"Current affairs"},{"e":"She had received ideas which disposed her to be courteous and kind to all, and to pity every one, as being less happy than herself.","c":"courteous","s":null,"src":"classic","a":"Jane Austen, Persuasion (1817)"},{"e":"They were more than kind and courteous, and took us at once on board the Czarina Catherine, which lay at anchor out in the river harbour.","c":"courteous","s":null,"src":"classic","a":"Bram Stoker, Dracula (1897)"}]},{"w":"indiscriminate","r":163,"s":[{"p":"adj","d":"done without careful choice or judgment"}],"x":[{"e":"When the invading army swept through the province, its indiscriminate looting stripped both wealthy estates and humble farms of anything of value.","c":"indiscriminate","s":0,"src":"own","f":"History"},{"e":"The farmer's indiscriminate spraying of pesticide killed pollinating bees along with the crop-eating beetles it was meant to target.","c":"indiscriminate","s":0,"src":"own","f":"Science"},{"e":"The old merchant's indiscriminate generosity, handing coins to every stranger who asked, left his family bewildered and eventually penniless by winter.","c":"indiscriminate","s":0,"src":"own","f":"Literature"},{"e":"Researchers criticized the poll for its indiscriminate sampling, since respondents were selected without regard to age, income, or region.","c":"indiscriminate","s":0,"src":"own","f":"Social science"},{"e":"Privacy advocates condemned the app's indiscriminate collection of personal data, gathering location, contacts, and browsing history without clear purpose or consent.","c":"indiscriminate","s":0,"src":"own","f":"Current affairs"},{"e":"The retreating general ordered an indiscriminate burning of villages, torching homes of loyal subjects and rebels alike without distinguishing between them.","c":"indiscriminate","s":0,"src":"own","f":"History"},{"e":"Doctors warned that indiscriminate prescribing of antibiotics for minor colds was helping bacteria evolve resistance faster than new drugs could be developed.","c":"indiscriminate","s":0,"src":"own","f":"Science"},{"e":"The young narrator's indiscriminate appetite for books meant she read fairy tales and philosophy with the same eager, undiscerning attention.","c":"indiscriminate","s":0,"src":"own","f":"Literature"},{"e":"Psychologists found that indiscriminate praise, given for every small effort, actually weakened children's motivation compared with feedback tied to real achievement.","c":"indiscriminate","s":0,"src":"own","f":"Social science"},{"e":"During the crisis, indiscriminate sharing of unverified rumors on social media spread panic faster than officials could correct the record.","c":"indiscriminate","s":0,"src":"own","f":"Current affairs"},{"e":"Gerty Farish, seated next to Selden, was lost in that indiscriminate and uncritical enjoyment so irritating to Miss Bart's finer perceptions.","c":"indiscriminate","s":null,"src":"classic","a":"Edith Wharton, The House of Mirth (1905)"},{"e":"The pupils ate apples and put straws down one another's backs, until Mr. Wopsle's great-aunt collected her energies, and made an indiscriminate totter at them with a birch-rod.","c":"indiscriminate","s":null,"src":"classic","a":"Charles Dickens, Great Expectations (1861)"}]},{"w":"superstitious","r":164,"s":[{"p":"adj","d":"believing in luck, magic, or signs that have no scientific basis"}],"x":[{"e":"Before setting sail, the sailors performed superstitious rituals, tossing coins overboard to appease sea spirits they believed controlled the storms.","c":"superstitious","s":0,"src":"own","f":"History"},{"e":"Astronomers noted that many villagers remained superstitious about comets, treating the harmless streaks of light as omens of coming disaster.","c":"superstitious","s":0,"src":"own","f":"Science"},{"e":"The old captain in the novel was so superstitious that he refused to whistle on deck, fearing it would summon a gale.","c":"superstitious","s":0,"src":"own","f":"Literature"},{"e":"A study of stress responses found people grow more superstitious under pressure, clutching lucky objects before uncertain exams or interviews.","c":"superstitious","s":0,"src":"own","f":"Social science"},{"e":"Some investors, superstitious about certain numbers, avoid stocks priced near supposedly unlucky figures even though the pattern has no real effect.","c":"superstitious","s":0,"src":"own","f":"Current affairs"},{"e":"Ancient farmers, superstitious about failed harvests, often blamed angry gods rather than drought or poor soil for their empty granaries.","c":"superstitious","s":0,"src":"own","f":"History"},{"e":"Geologists studying folk explanations for tremors found people still superstitious, insisting restless spirits beneath the earth caused the shaking ground.","c":"superstitious","s":0,"src":"own","f":"Science"},{"e":"In the play, the aging actress proves superstitious, insisting no one utter the cursed title of the tragedy backstage.","c":"superstitious","s":0,"src":"own","f":"Literature"},{"e":"Sociologists examining athletes noted many remain superstitious, wearing the same socks for every game despite knowing the habit changes nothing.","c":"superstitious","s":0,"src":"own","f":"Social science"},{"e":"Residents near the new cell tower grew superstitious, blaming the structure for unrelated illnesses despite engineers finding no scientific connection.","c":"superstitious","s":0,"src":"own","f":"Current affairs"},{"e":"I may be deemed superstitious, and even egotistical, in regarding this event as a special interposition of divine Providence in my favor.","c":"superstitious","s":null,"src":"classic","a":"Frederick Douglass, Narrative of the Life of Frederick Douglass (1845)"},{"e":"No wonder that my Lord Steyne, who liked pleasure and cheerfulness, was not often seen after their marriage by the side of this trembling, silent, superstitious, unhappy lady.","c":"superstitious","s":null,"src":"classic","a":"William Makepeace Thackeray, Vanity Fair (1848)"}]},{"w":"conscientious","r":165,"s":[{"p":"adj","d":"careful and thorough in doing one's work or duty"},{"p":"adj","d":"guided by a sense of right and wrong"}],"x":[{"e":"The monastery's conscientious scribe checked every copied line twice, refusing to let a single misspelled word slip past his careful eye.","c":"conscientious","s":0,"src":"own","f":"History"},{"e":"The conscientious lab technician recorded every measurement twice, unwilling to risk an error slipping into the published results.","c":"conscientious","s":0,"src":"own","f":"Science"},{"e":"The conscientious student in the story rewrote her essay five times, unwilling to submit anything less than her most careful work.","c":"conscientious","s":0,"src":"own","f":"Literature"},{"e":"Managers rated the conscientious employee highest, noting she never missed a deadline and double-checked every report before submission.","c":"conscientious","s":0,"src":"own","f":"Social science"},{"e":"The city's conscientious planner reviewed each construction proposal line by line, refusing to approve projects without full environmental review.","c":"conscientious","s":0,"src":"own","f":"Current affairs"},{"e":"During the war, the conscientious objector refused to bear arms, insisting his moral convictions forbade him from taking another life.","c":"conscientious","s":1,"src":"own","f":"History"},{"e":"A conscientious field researcher logged the weather, soil moisture, and plant height each morning, never skipping a single data entry.","c":"conscientious","s":0,"src":"own","f":"Science"},{"e":"Though tempted by the reward, the conscientious knight refused to betray his friend, guided by a code he would not break.","c":"conscientious","s":1,"src":"own","f":"Literature"},{"e":"The conscientious whistleblower reported the fraud despite knowing it would cost her career, unable to stay silent about the wrongdoing.","c":"conscientious","s":1,"src":"own","f":"Social science"},{"e":"Conscientious volunteers sorted the donated food carefully, checking expiration dates so nothing spoiled would reach families in need.","c":"Conscientious","s":0,"src":"own","f":"Current affairs"},{"e":"Nor are the most conscientious compilations of Natural History for the benefit of the young and tender, free from the same heinousness of mistake.","c":"conscientious","s":null,"src":"classic","a":"Herman Melville, Moby-Dick (1851)"},{"e":"Mihail Vassilievitch Sludin, the chief secretary, was a straightforward, intelligent, good-hearted, and conscientious man, and Alexey Alexandrovitch was aware of his personal goodwill.","c":"conscientious","s":null,"src":"classic","a":"Leo Tolstoy, Anna Karenina (tr. Constance Garnett) (1878)"}]},{"w":"hospitable","r":166,"s":[{"p":"adj","d":"friendly and welcoming to guests"},{"p":"adj","d":"(of an environment) favorable for living or growing"}],"x":[{"e":"Travelers crossing the desert found the nomadic clan remarkably hospitable, offering food, water, and shelter to weary strangers without hesitation.","c":"hospitable","s":0,"src":"own","f":"History"},{"e":"Visiting scholars at the observatory found the staff hospitable, sharing equipment and offering guidance to anyone new to the research.","c":"hospitable","s":0,"src":"own","f":"Science"},{"e":"The innkeeper in the tale was famously hospitable, always keeping a spare room and warm meal ready for unexpected travelers.","c" adj","d":"able to spread disease"},{"p":"adj","d":"likely to spread quickly to others, as a feeling or laugh"}],"x":[{"e":"During the plague years, physicians quarantined the sick, fearing the illness was infectious and could leap from one household to the next.","c":"infectious","s":0,"src":"own","f":"History"},{"e":"When the outbreak began, epidemiologists traced how the infectious agent moved through crowded markets, jumping easily from one vendor to the next.","c":"infectious","s":0,"src":"own","f":"Science"},{"e":"The playwright's chorus warns that the fever gripping the court is infectious, spreading silently from servant to noble alike.","c":"infectious","s":0,"src":"own","f":"Literature"},{"e":"Sociologists studying dense urban housing found that residents changed daily routines once officials confirmed the new respiratory illness was infectious, spreading rapidly through shared stairwells and elevators.","c":"infectious","s":0,"src":"own","f":"Social science"},{"e":"Health officials warned that the new variant was more infectious than earlier strains, prompting renewed calls for masking indoors.","c":"infectious","s":0,"src":"own","f":"Current affairs"},{"e":"Even amid famine, the general's booming laughter was so infectious that weary soldiers soon forgot their hunger and began to smile.","c":"infectious","s":1,"src":"own","f":"History"},{"e":"Researchers wore full protective suits, since the newly discovered pathogen proved highly infectious even in tiny airborne droplets.","c":"infectious","s":0,"src":"own","f":"Science"},{"e":"In the novel, the heroine's optimism proved infectious, lifting the spirits of every despairing villager she met along the road.","c":"infectious","s":1,"src":"own","f":"Literature"},{"e":"Economists noted that consumer panic can be infectious, spreading through a market as investors mimic their neighbors' sudden fear.","c":"infectious","s":1,"src":"own","f":"Social science"},{"e":"City officials closed the pool after tests revealed the water carried an infectious bacterium capable of causing serious illness in swimmers.","c":"infectious","s":0,"src":"own","f":"Current affairs"},{"e":"\"This is not a lying-in home, but a hospital for the sick, and is intended for all diseases, except infectious complaints,\" he said.","c":"infectious","s":null,"src":"classic","a":"Leo Tolstoy, Anna Karenina (tr. Constance Garnett) (1878)"},{"e":"And the infectious poison of that sin had been thus rapidly diffused throughout his moral system.","c":"infectious","s":null,"src":"classic","a":"Nathaniel Hawthorne, The Scarlet Letter (1850)"}]},{"w":"philosophical","r":168,"s":[{"p":"adj","d":"relating to the study of basic ideas about knowledge and life"},{"p":"adj","d":"calm and accepting in the face of difficulty"}],"x":[{"e":"Ancient Athenian thinkers gathered in the agora to debate philosophical questions about justice, virtue, and the nature of the good life.","c":"philosophical","s":0,"src":"own","f":"History"},{"e":"The physicist's late writings drifted into philosophical territory, questioning whether the universe's laws imply any deeper purpose or meaning.","c":"philosophical","s":0,"src":"own","f":"Science"},{"e":"The novel's narrator pauses mid-chapter for a philosophical meditation on memory, asking whether the past can ever be truly known.","c":"philosophical","s":0,"src":"own","f":"Literature"},{"e":"Linguists sometimes engage in philosophical debate over whether language shapes thought or merely reflects ideas already present in the mind.","c":"philosophical","s":0,"src":"own","f":"Social science"},{"e":"The panel's philosophical discussion of artificial intelligence asked whether a machine could ever truly possess consciousness or moral responsibility.","c":"philosophical","s":0,"src":"own","f":"Current affairs"},{"e":"After losing the election, the aging senator grew philosophical, accepting defeat calmly rather than raging against the crowd that rejected him.","c":"philosophical","s":1,"src":"ow od demands separate tables.","c":"aristocratic","s":0,"src":"own","f":"Literature"},{"e":"Researchers studying class distinction found that aristocratic surnames still open doors closed to those without noble ancestry.","c":"aristocratic","s":0,"src":"own","f":"Social science"},{"e":"The renovated palace museum lets visitors experience aristocratic luxury that was once reserved solely for nobles and their guests.","c":"aristocratic","s":0,"src":"own","f":"Current affairs"},{"e":"You can talk so well, look so aristocratic in your best things, and behave so beautifully, if you try, that I'm proud of you.","c":"aristocratic","s":null,"src":"classic","a":"Louisa May Alcott, Little Women (1868)"},{"e":"Her memory had an aristocratic bias, and was very treacherous whenever she tried to recall any circumstance connected with those below her in life.","c":"aristocratic","s":null,"src":"classic","a":"Elizabeth Gaskell, North and South (1855)"}]},{"w":"meditate","r":172,"s":[{"p":"v","d":"to think deeply and quietly"},{"p":"v","d":"to focus the mind as a spiritual or calming practice"}],"x":[{"e":"Isolated in exile, the deposed emperor spent his final years meditating on the mistakes that had cost him his throne.","c":"meditating","s":0,"src":"own","f":"History"},{"e":"A geologist meditated on the puzzling rock layers for weeks before proposing that an ancient flood had deposited them.","c":"meditated","s":0,"src":"own","f":"Science"},{"e":"Alone by the window, the narrator meditated on her failed marriage, turning each small regret over in her mind.","c":"meditated","s":0,"src":"own","f":"Literature"},{"e":"Economists meditating on the causes of the downturn eventually traced it to a sudden collapse in consumer confidence.","c":"meditating","s":0,"src":"own","f":"Social science"},{"e":"City planners meditated on the failed transit proposal, quietly weighing why residents had rejected it so firmly.","c":"meditated","s":0,"src":"own","f":"Current affairs"},{"e":"Ancient monks
